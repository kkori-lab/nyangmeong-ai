[project]
name = "nyangmeong-ai"
version = "0.1.0"
description = "냥멍케어 AI 서비스 (AI 대화창, 영수증 OCR, 픽셀 캐릭터 생성)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.115",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
