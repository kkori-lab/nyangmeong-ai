# 검사 수치 입력(SCR-HLT-007) 혈액검사 항목 드롭다운 12종 (건강기록 기능명세서 v1.1, FN-HLT-007-02)
# 명세가 바뀌면 이 파일만 고친다. 결과지에 별칭으로 찍힌 항목을 code(표준 약어)로 맞춘다.
# 별칭은 대소문자·공백·'-'·'_'·'.'을 빼고 대조한다. 목록에 없으면 결과지 표기 그대로 둔다(직접입력).
# cd: 검사항목 공통코드(HLTG12, INSP_NVL.INSP_ARTCL_CD). 백엔드 db/ 기초 데이터 v0.10 기준.
#     cd가 없는 항목(SDMA, HLTG12에 코드 없음)은 약어를 직접입력명(INSP_ARTCL_DRCT_INPT_NM)으로 보낸다.
version: v1.1
