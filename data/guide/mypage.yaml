# 서비스 안내서 — 마이페이지 (AI 매니저 사용법 안내, FN-AIM-002-02)
# 청크 = task 하나. id는 바꾸지 않는다(평가 정답표 tests/chat/data/guide_labels.json이 id로 가리킴)
# num·name·scr_id·param은 data/routes.snapshot.json과 같다(매핑표와는 scr_id·param으로 이음). 사람용 메모는 docs/guide-review.md
version: draft-0.1
updated: '2026-11-05'
screens:
- num: 5
  scr_id: SCR-MYP-001
  name: 마이페이지 홈
  param: null
  routable: true
  path: /mypage
  login_required: true
  summary: 포인트, 이번 달 지출, 오늘의 케어미션 달성률과 내 반려동물 카드를 한 화면에서 보는 곳이에요.
  entry:
    pc:
    - 헤더 오른쪽 프로필 > [마이페이지]
    - 왼쪽 메뉴 [마이페이지 홈]
    mobile:
    - 헤더의 [전체 메뉴] 맨 위 내 이름 부분
    other:
    - 공동양육 초대 수락 화면의 [나중에 하기], [마이페이지 홈으로]
  status: 정상
  not_ready: []
  tasks:
  - id: 5-1
    task: 내 포인트·지출·미션 한눈에 보기
    steps:
    - 헤더 오른쪽 프로필에서 [마이페이지]를 눌러요(모바일은 [전체 메뉴] 맨 위 내 이름 부분)
    - 맨 위 "한눈에 보기" 칸에서 보유 포인트, 이번달 지출액, 오늘의 케어미션 달성률을 확인해요
    - 더 자세히 보려면 칸을 눌러요. 포인트와 케어미션 칸은 포인트 화면으로, 지출 칸은 가계부로 가요
    notes:
    - 케어미션 달성률은 퍼센트와 진행 막대로 보여요
    faq_keywords:
    - 마이페이지
    - 내 정보
    - 한눈에 보기
    - 포인트 얼마
    - 이번달 지출
  - id: 5-2
    task: 내 반려동물 카드 보기
    steps:
    - 마이페이지 홈 아래쪽 반려동물 영역을 봐요
    - 6마리가 넘으면 [더보기 +N]을 눌러 나머지를 펼쳐요
    - 다시 접으려면 [접기]를 눌러요
    - 영역 제목 옆 링크를 누르면 반려동물 관리로 가요
    notes:
    - 카드에는 이름, 품종, 나이가 보여요. 대표 반려동물에는 [대표] 표시가 있어요
    - 공동양육으로 참여한 반려동물은 [공동양육] 표시가 붙어요
    faq_keywords:
    - 내 반려동물
    - 우리 애 목록
    - 대표 반려동물 어디서 봐
  - id: 5-3
    task: 반려동물이 없을 때 등록하러 가기
    steps:
    - 반려동물 영역의 등록 안내에서 [반려동물 등록하기]를 눌러요
    - 반려동물 관리 화면으로 이동해요
    notes: []
    faq_keywords:
    - 반려동물 처음 등록
    - 등록하러 가기
- num: 6
  scr_id: SCR-MYP-010
  name: 픽셀 캐릭터 관리
  param: null
  routable: true
  path: /mypage/characters
  login_required: true
  summary: 반려동물의 픽셀 캐릭터를 만들고, 대표 반려동물을 정하고, 캐릭터를 눌러 꾸미는 곳이에요. 캐릭터는 AI가 사진을 보고 만들어 줘요.
  entry:
    pc:
    - 프로필 > [마이페이지] > 왼쪽 메뉴 [픽셀 캐릭터]
    mobile:
    - 헤더의 [전체 메뉴] 맨 위 내 이름 > 하단 탭 [캐릭터]
    other:
    - 포인트 화면의 [캐릭터 꾸미기] 버튼(PC)과 [픽셀 캐릭터로 이동]
  status: 정상
  not_ready: []
  tasks:
  - id: 6-1
    task: 캐릭터 만들기
    steps:
    - 마이페이지 > [픽셀 캐릭터]로 가요
    - 캐릭터가 없는 반려동물 카드(물음표 그림)에서 [캐릭터 만들기]를 눌러요
    - 반려동물 사진을 첨부해요
    - '[만들기]를 눌러요'
    - 만드는 동안 창을 닫아도 계속 만들어져요. 끝나면 알림으로 알려줘요
    - 완성되면 결과 창에서 [확인]을 눌러요
    notes:
    - 사진은 귀·꼬리·발이 모두 보이는 것이 좋아요
    - jpg, png, webp 사진만 올릴 수 있고 10MB 이하여야 해요
    - 사진은 꼭 있어야 해요. 품종·털색·특징은 반려동물 등록 정보를 그대로 써요
    - 캐릭터는 반려동물 1마리당 한 번만 만들 수 있고 다시 만들 수 없어요
    - 주양육자만 만들 수 있어요. 공동양육자는 볼 수만 있어요
    - 만들지 못하면 "캐릭터를 만들지 못했어요" 창이 뜨고 종류별 기본 캐릭터로 보여요. 잠시 뒤 다시 시도해요
    faq_keywords:
    - 캐릭터 만들기
    - 픽셀 캐릭터
    - 캐릭터 생성
    - 캐릭터 안 만들어져
    - 사진 올리기
  - id: 6-2
    task: 캐릭터 결과가 이상할 때 문의하기
    steps:
    - 캐릭터 완성 창의 [오류 문의]를 눌러요(또는 꾸미기 화면 오른쪽 위 [오류 문의])
    - 1:1 문의 작성 화면이 열리고 문의 유형과 캐릭터 이미지가 미리 채워져요
    - 내용을 적어 접수해요
    notes:
    - 이미 접수했으면 버튼이 [문의 접수됨]으로 바뀌어요
    - 접수되면 확인이 끝날 때까지 카드에 "오류 확인 중"이 보이고 기본 캐릭터로 바뀌며 꾸미기에 들어갈 수 없어요
    faq_keywords:
    - 캐릭터 이상해
    - 꼬리 다리 이상
    - 캐릭터 오류 문의
  - id: 6-3
    task: 대표 반려동물 정하기
    steps:
    - 마이페이지 > [픽셀 캐릭터]의 "내 캐릭터" 탭으로 가요
    - 대표로 하고 싶은 반려동물 카드 아래 [대표 지정]을 눌러요
    notes:
    - 이미 대표인 카드에는 [대표] 표시가 붙고 [대표 지정] 버튼이 없어요
    - 내가 주양육자인 반려동물만 대표로 정할 수 있어요
    faq_keywords:
    - 대표 지정
    - 대표 반려동물
    - 대표 바꾸기
  - id: 6-4
    task: 캐릭터 꾸미러 가기
    steps:
    - '"내 캐릭터" 탭에서 완성된 캐릭터 카드를 눌러요'
    - 꾸미기 화면이 열려요(자세한 방법은 픽셀 캐릭터 상세 참고)
    notes:
    - 만드는 중이거나 오류 확인 중인 캐릭터는 꾸밀 수 없어요
    faq_keywords:
    - 캐릭터 꾸미기
    - 아이템 착용
  - id: 6-5
    task: 공동양육 반려동물 캐릭터 보기
    steps:
    - 공동양육 반려동물이 있으면 [공동양육] 탭이 보여요. 탭을 눌러요
    notes:
    - 공동양육자는 조회만 가능해요. 만들기·대표 지정·꾸미기가 안 돼요
    - 공동양육 반려동물이 하나도 없으면 [공동양육] 탭이 보이지 않아요
    faq_keywords:
    - 공동양육 캐릭터
    - 공동양육 탭
- num: 26
  scr_id: SCR-MYP-002
  name: 반려동물 등록·수정
  param: null
  routable: true
  path: /mypage/pets
  login_required: true
  summary: 반려동물을 등록하고, 정보를 고치고, 삭제하는 곳이에요. 한 마리씩 카드로 넘겨 보며 아래에서 가족(공동양육자)도 함께 볼 수 있어요.
  entry:
    pc:
    - 프로필 > [마이페이지] > 왼쪽 메뉴 [반려동물 관리]
    mobile:
    - 헤더의 [전체 메뉴] 맨 위 내 이름 > 하단 탭 [반려동물]
    other:
    - 마이페이지 홈의 반려동물 영역 링크
    - 마이페이지 홈의 반려동물이 없을 때 [반려동물 등록하기]
    - 포인트 화면 케어미션 안내의 [반려동물 등록하기] (그 화면 위에 등록 창이 열려요)
    - 캐릭터 화면의 [반려동물 등록하기]
  status: 정상
  not_ready: []
  tasks:
  - id: 26-1
    task: 반려동물 등록하기
    steps:
    - 마이페이지 > [반려동물 관리]로 가요
    - 맨 뒤 "새 반려동물 등록" 카드(또는 점 줄 맨 끝 +)에서 [반려동물 등록하기]를 눌러요. 한 마리도 없으면 안내 화면의 [반려동물 등록하기]를 눌러요
    - 이름, 종류(강아지·고양이), 품종, 생년월일, 성별, 털색, 체중, 체중 정상범위를 입력해요
    - 필요하면 [추가 정보]를 펼쳐 인식칩 번호, 목표체중, 특징, 알레르기, 기저질환을 적어요
    - '[등록하기]를 눌러요'
    notes:
    - 이름은 최대 20자예요
    - 품종이 목록에 없으면 맨 아래 [직접 입력]을 골라요. 털색도 [직접 입력]이 있어요
    - 인식칩 번호는 숫자만 최대 20자리예요. 알레르기·기저질환은 여러 개면 쉼표(,)로 나눠 적어요
    - 처음 등록한 반려동물이 자동으로 대표가 돼요
    - 반려동물 사진은 등록할 때 받지 않아요. 사진은 캐릭터를 만들 때만 올려요
    - 내가 주양육자로 등록할 수 있는 반려동물은 최대 10마리예요. 공동양육 반려동물은 세지 않아요
    - 10마리가 되면 등록 카드 대신 "반려동물을 모두 등록했어요" 안내가 보이고, 삭제해서 줄면 다시 등록할 수 있어요
    faq_keywords:
    - 반려동물 등록
    - 프로필 등록
    - 우리 애 정보
    - 강아지 등록
    - 고양이 등록
    - 몇 마리까지
  - id: 26-2
    task: 반려동물 정보 수정하기
    steps:
    - 마이페이지 > [반려동물 관리]에서 수정할 반려동물 카드를 열어요(좌우 화살표나 점으로 넘겨요)
    - 이름 줄 오른쪽 점 세 개 메뉴에서 [반려동물 정보 수정]을 눌러요
    - 값을 고치고 [저장]을 눌러요
    notes:
    - 체중은 건강 일지에 기록한 가장 최근 값이 보여요. 잘못 입력한 체중만 고칠 수 있고, 몸무게가 달라졌다면 건강 일지에 기록해요
    - 수정 창의 [건강 일지에서 기록하기]를 누르면 건강 일지 화면으로 이동해요
    faq_keywords:
    - 반려동물 수정
    - 정보 바꾸기
    - 체중 수정
    - 품종 바꾸기
  - id: 26-3
    task: 반려동물 삭제하기
    steps:
    - 지우려는 반려동물 카드의 점 세 개 메뉴에서 [반려동물 삭제]를 눌러요
    - 확인 창에서 [삭제]를 눌러요
    notes:
    - 주양육자만 삭제할 수 있어요
    - 삭제하면 건강기록과 픽셀 캐릭터 등 연결된 데이터가 함께 사라지고 복구할 수 없어요
    - 가계부 지출 기록은 남고 반려동물 이름 옆에 "(삭제됨)"이 붙어요
    - 삭제하면 연결된 공동양육자의 연동도 해제돼요
    faq_keywords:
    - 반려동물 삭제
    - 반려동물 지우기
    - 반려동물 없애기
  - id: 26-4
    task: 내가 공동양육자인 반려동물에서 빠지기
    steps:
    - 공동양육 반려동물 카드의 점 세 개 메뉴에서 [연동 해제]를 눌러요
    - 확인 창에서 [해제]를 눌러요
    notes:
    - 공동양육자에게는 [반려동물 삭제] 대신 [연동 해제]가 보여요
    - 해제하면 그 반려동물의 건강기록·프로필을 더 볼 수 없고, 다시 연동하려면 주양육자에게 초대를 다시 받아야 해요
    faq_keywords:
    - 연동 해제
    - 공동양육 그만
    - 가족에서 나가기
  - id: 26-5
    task: 반려동물 정보 자세히 보기
    steps:
    - 카드에서 종, 성별(중성화 여부), 체중, 털색, 인식 번호, 알레르기, 기저질환을 확인해요
    - 항목이 많으면 [외 N개]를, 특징이 길면 [더보기]를 눌러 전체를 봐요
    notes:
    - 모바일에서는 [정보 더보기]를 눌러 펼쳐요
    - 카드마다 [주양육] 또는 [공동양육] 표시가 보여요. 내가 그 반려동물에 대해 어떤 역할인지 알려줘요
    faq_keywords:
    - 반려동물 정보 보기
    - 알레르기 확인
- num: 27
  scr_id: SCR-MYP-004
  name: 공동양육 관리
  param: null
  routable: true
  path: /mypage/pets
  login_required: true
  summary: 반려동물 관리 화면 카드 아래 "가족" 영역에서 공동양육자를 초대하고 연동을 해제하는 곳이에요. 별도 화면은 없어요.
  entry:
    pc:
    - 프로필 > [마이페이지] > 왼쪽 메뉴 [반려동물 관리] > 반려동물 카드 아래 "가족" 영역
    mobile:
    - 헤더의 [전체 메뉴] 맨 위 내 이름 > 하단 탭 [반려동물] > 반려동물 카드 아래 "가족" 영역
    other:
    - 초대 수락·거절은 받은 초대 링크로 들어가는 화면(마이페이지 > 반려동물 관리 메뉴가 선택된 화면)에서 해요
  status: 정상
  not_ready: []
  tasks:
  - id: 27-1
    task: 공동양육자 초대하기
    steps:
    - 마이페이지 > [반려동물 관리]에서 초대할 반려동물 카드를 열어요
    - 카드 아래 "가족" 영역의 점선 카드 [가족 초대]를 눌러요
    - 초대할 상대의 이메일 주소를 입력해요
    - 초대할 반려동물을 골라요(지금 보던 반려동물이 먼저 선택돼 있어요)
    - '[초대 보내기]를 눌러요'
    notes:
    - 주양육자만 초대할 수 있어요. 공동양육자에게는 [가족 초대]가 보이지 않아요
    - 가입한 회원에게는 알림으로, 아직 가입하지 않았다면 이메일로 초대가 가요
    - 반려동물 한 마리당 공동양육자는 최대 5명이에요. 5명이 모두 차면 [가족 초대]가 사라지고 "5명이 모두 연동돼 더 초대할 수 없어요"가 보여요. 남은 자리는 "N자리 남음"으로 보여요
    - 이미 가족이거나 이미 초대를 보낸 반려동물은 고를 수 없어요
    - 초대는 보낸 날부터 7일 동안만 받을 수 있어요
    - 이메일 형식이 틀리면 "이메일 형식이 올바르지 않아요"가 나와요
    faq_keywords:
    - 공동양육 초대
    - 같이 키우기
    - 가족 초대
    - 초대 보내기
    - 공동양육자 추가
  - id: 27-2
    task: 내가 보낸 초대 확인하기
    steps:
    - 마이페이지 > [반려동물 관리] 화면 맨 아래 "보낸 초대"를 봐요
    notes:
    - 상태는 대기중, 수락, 거절, 만료됨으로 보여요
    - 대기중인 초대는 만료일이 함께 보여요
    - 이 목록은 내 계정 전체의 초대예요
    faq_keywords:
    - 보낸 초대
    - 초대 상태
    - 초대 수락했는지
  - id: 27-3
    task: 받은 초대 수락하기
    steps:
    - 알림이나 이메일로 받은 초대 링크를 열어요(로그인이 필요해요)
    - 함께 돌볼 반려동물을 골라요(빼면 그 반려동물만 거절돼요)
    - '[수락]을 눌러요'
    - 반려동물 관리 화면으로 이동하고 방금 연동한 반려동물이 먼저 보여요
    notes:
    - 초대받은 이메일과 다른 계정으로 로그인했으면 안내가 나와요. [초대받은 계정으로 로그인]을 누르면 로그아웃한 뒤 로그인 화면으로 가요
    - 초대는 7일이 지나면 만료돼요. 만료되었거나 이미 처리된 초대는 안내만 나와요
    - 나중에 하려면 [나중에 하기]를 눌러요
    faq_keywords:
    - 초대 수락
    - 초대 받았어
    - 공동양육 참여
    - 초대 링크
  - id: 27-4
    task: 초대 거절하기
    steps:
    - 초대 링크를 열어 [거절]을 눌러요
    - 확인 창에서 [거절]을 한 번 더 눌러요
    notes:
    - 거절하면 이 초대는 사라져요. 다시 참여하려면 초대한 사람에게 다시 초대받아야 해요
    faq_keywords:
    - 초대 거절
    - 초대 싫어
  - id: 27-5
    task: 공동양육자 연동 해제하기(주양육자)
    steps:
    - 반려동물 카드 아래 "가족" 영역에서 해제할 공동양육자 카드 오른쪽 위 [X]를 눌러요
    - 확인 창에서 [해제]를 눌러요
    notes:
    - 주양육자만 강제로 해제할 수 있어요
    - 해제하면 그 사람은 해당 반려동물의 기록을 더 볼 수 없어요
    faq_keywords:
    - 공동양육자 삭제
    - 가족에서 빼기
    - 연동 해제
    - 공동양육 끊기
  - id: 27-6
    task: 공동양육자로서 가족 영역 보기
    steps:
    - 공동양육 반려동물 카드 아래 "가족" 영역을 봐요
    notes:
    - 주양육자(등록한 사람)와 나의 연동일만 보여요. 다른 공동양육자는 보이지 않아요
    - 내가 빠지려면 카드의 점 세 개 메뉴에서 [연동 해제]를 눌러요
    - 초대와 다른 사람 해제는 할 수 없어요
    faq_keywords:
    - 가족 영역
    - 주양육자 누구
- num: 28
  scr_id: SCR-MYP-011
  name: 픽셀 캐릭터 상세
  param: null
  routable: false
  path: /mypage/characters?pixelCharSn=<캐릭터번호>
  login_required: true
  see: 6
  summary: 완성된 캐릭터에 아이템을 입혀 꾸미는 화면이에요. 이 안에서 아이템 상점 창으로 아이템을 사요.
  entry:
    pc:
    - 마이페이지 > [픽셀 캐릭터] > "내 캐릭터" 탭에서 완성된 캐릭터 카드 누르기
    mobile:
    - 마이페이지 > 하단 탭 [캐릭터] > 완성된 캐릭터 카드 누르기
    other:
    - 꾸미기 화면 보관함 위 [아이템 상점]에서 상점 창 열기
  status: 정상
  not_ready: []
  tasks:
  - id: 28-1
    task: 아이템 착용하고 저장하기
    steps:
    - 보관함에서 부위 탭(머리·얼굴·목·의상·가방)을 골라요
    - 입히고 싶은 아이템을 눌러요. 미리보기에 바로 보여요
    - 같은 아이템을 다시 누르면 벗어요. 같은 부위의 다른 아이템을 누르면 바뀌어요
    - 마음에 들면 [장착]을 눌러 저장해요
    - 저장 전에 처음 상태로 돌리려면 [되돌리기]를 눌러요
    notes:
    - 저장하지 않고 나가면 바꾼 착용 상태는 반영되지 않아요
    - 주양육자만 꾸밀 수 있어요
    - 미리보기 옆 슬롯의 아이템 X로도 벗을 수 있어요
    faq_keywords:
    - 캐릭터 꾸미기
    - 아이템 착용
    - 아이템 장착
    - 아이템 벗기
  - id: 28-2
    task: 아이템 사기
    steps:
    - 꾸미기 화면 보관함 위 [아이템 상점]을 눌러요
    - 부위 탭(전체·머리·얼굴·목·의상·가방)에서 사고 싶은 아이템을 담아요
    - 담은 아이템은 미리보기에서 입혀 볼 수 있어요. 빼려면 담은 목록의 X를 눌러요. [원래대로]로 미리보기를 되돌려요
    - 아래 선택 개수·총 포인트·보유 포인트를 확인하고 [구매하기]를 눌러요
    - 산 아이템은 이 캐릭터의 보관함에 들어가요
    notes:
    - 포인트가 모자라면 "포인트가 부족해요"가 나오고 [구매하기]를 누를 수 없어요. 담기는 가능해요
    - 이미 가진 아이템에는 "보유중" 표시가 붙어요
    - 아이템은 캐릭터마다 따로 사야 해요. 주양육자만 살 수 있어요
    - 포인트는 케어미션을 하면 쌓여요
    faq_keywords:
    - 아이템 구매
    - 아이템 상점
    - 포인트로 사기
    - 포인트 부족
  - id: 28-3
    task: 캐릭터에 문제가 있을 때 문의하기
    steps:
    - 꾸미기 화면 오른쪽 위 [오류 문의]를 눌러요
    notes:
    - 이미 접수했으면 [문의 접수됨]으로 바뀌어요
    faq_keywords:
    - 캐릭터 오류
    - 캐릭터 문의
- num: 29
  scr_id: SCR-MYP-020
  name: 케어미션 · 포인트
  param: null
  routable: true
  path: /mypage/points
  login_required: true
  summary: 케어미션 달성으로 쌓은 포인트와 쓴 내역, 오늘의 미션을 보는 곳이에요. 포인트는 픽셀 캐릭터 아이템을 살 때 써요.
  entry:
    pc:
    - 프로필 > [마이페이지] > 왼쪽 메뉴 [포인트 관리 / 케어미션]
    mobile:
    - 헤더의 [전체 메뉴] 맨 위 내 이름 > 하단 탭 [포인트]
    other:
    - 마이페이지 홈의 포인트 칸·오늘의 케어미션 칸
  status: 정상
  not_ready: []
  tasks:
  - id: 29-1
    task: 내 포인트 확인하기
    steps:
    - 마이페이지 > [포인트 관리 / 케어미션]으로 가요
    - 맨 위에서 보유 포인트, 이번 달 적립·사용, 오늘 미션 달성 현황을 봐요
    notes:
    - 이번 달 적립·사용은 포인트와 건수로 보여요
    faq_keywords:
    - 포인트 확인
    - 보유 포인트
    - 내 포인트
  - id: 29-2
    task: 오늘의 케어미션 확인하기
    steps:
    - '"오늘의 케어미션"에서 반려동물 탭을 골라요'
    - 탭에는 반려동물 이름과 완료 개수가 함께 보여요
    - 미션별로 완료·미완료와 받을 포인트를 확인해요
    notes:
    - 케어미션은 내가 주양육자인 반려동물에게만 주어져요. 공동양육 반려동물은 보이지 않아요
    - 미션은 직접 누르는 게 아니라 건강기록 등 다른 활동을 하면 자동으로 완료돼요
    - 미완료 미션은 자정에 진행률만큼 정산돼요
    - 반려동물이 없으면 "반려동물을 등록하면 케어미션을 받을 수 있어요" 안내와 [반려동물 등록하기]가 보여요
    faq_keywords:
    - 케어미션
    - 오늘 미션
    - 미션 완료
    - 미션 뭐야
  - id: 29-3
    task: 지난 날짜 미션 보기
    steps:
    - 오늘의 케어미션 위 이전·다음 날짜 화살표를 눌러요
    notes:
    - 오늘보다 뒤 날짜는 볼 수 없어요
    - 그 날 출제된 미션이 없으면 "이 날은 출제된 미션이 없어요"가 보여요
    faq_keywords:
    - 어제 미션
    - 지난 미션
  - id: 29-4
    task: 포인트 적립·사용 내역 보기
    steps:
    - 화면의 "포인트 내역"에서 이전달·다음달 화살표로 월을 바꿔요
    - 적립과 사용이 최신순으로 보여요
    notes:
    - 내역이 많으면 [더보기]로 펼쳐요
    - 관리자가 조정한 내역은 "관리자 조정"으로 보여요
    - 내역이 없는 달은 "이 달의 내역이 없어요"가 보여요
    faq_keywords:
    - 포인트 내역
    - 포인트 사용 내역
    - 적립 내역
  - id: 29-5
    task: 포인트 모으는 법 알아보기
    steps:
    - 화면 아래 "포인트는 이렇게 모여요"를 봐요
    - 포인트로 아이템을 사려면 [픽셀 캐릭터로 이동]을 눌러요
    notes:
    - 케어미션 완료 시 미션마다 1~20P가 쌓여요
    - 검진기록을 등록하면 20P가 쌓여요
    - 미완료 미션은 자정에 진행률만큼 정산돼요
    faq_keywords:
    - 포인트 적립
    - 포인트 모으는 법
    - 포인트 어디에 써
- num: 30
  scr_id: SCR-MYP-030
  name: 가계부
  param: null
  routable: true
  path: /mypage/expenses
  login_required: true
  summary: 반려동물에게 쓴 돈을 날짜별로 기록하고 월별 총액, 한도, 카테고리·반려동물별 통계를 보는 곳이에요.
  entry:
    pc:
    - 프로필 > [마이페이지] > 왼쪽 메뉴 [가계부]
    mobile:
    - 헤더의 [전체 메뉴] 맨 위 내 이름 > 하단 탭 [소비]
    other:
    - 마이페이지 홈의 이번달 지출액 칸
  status: 정상
  not_ready: []
  tasks:
  - id: 30-1
    task: 지출 직접 입력해서 등록하기
    steps:
    - 마이페이지 > [가계부]의 달력에서 지출 날짜를 눌러요
    - 아래 펼쳐진 날짜별 내역에서 [지출 추가]를 눌러요
    - '"직접 입력하기"를 골라요'
    - 날짜, 반려동물, 카테고리, 금액을 입력하고 사용처·내용은 필요하면 적어요
    - '[저장]을 눌러요'
    notes:
    - 날짜는 오늘까지만 고를 수 있어요. 미래 날짜는 등록할 수 없어요
    - 카테고리는 병원·사료·간식·용품·미용·돌봄·기타 7가지예요
    - 병원비는 반려동물을 골라야 해요. 다른 카테고리는 반려동물 여러 마리가 함께 쓴 경우 "공용"을 고를 수 있어요
    - 사용처는 최대 80자예요
    - 같은 날짜·반려동물·카테고리·금액의 지출이 있으면 "이미 같은 지출이 있어요" 창이 떠요. 그래도 저장하려면 [그래도 저장]을 눌러요
    - 주양육·공동양육 구분 없이 연동된 반려동물 모두 고를 수 있어요
    faq_keywords:
    - 지출 등록
    - 가계부 쓰기
    - 돈 기록
    - 병원비 기록
    - 지출 추가
  - id: 30-2
    task: 영수증으로 지출 등록하기
    steps:
    - 달력에서 날짜를 눌러 [지출 추가] > "영수증으로 등록하기"를 골라요
    - '[촬영하기] 또는 [파일 선택]으로 영수증 사진을 올려요'
    - '[분석 요청]을 눌러요'
    - 인식 결과 확인 창에서 날짜·카테고리·금액 등을 확인하고 고쳐요
    - '[저장]을 눌러요'
    notes:
    - 인식 결과는 틀릴 수 있어서 저장 전에 꼭 확인해야 해요
    - 영수증 날짜가 누른 날짜와 달라도 영수증 날짜를 우선 채워요
    - 인식이 안 되면 "영수증을 읽지 못했어요"가 뜨고 [다시 촬영] 또는 [직접 입력]을 고를 수 있어요
    - 반려동물별로 금액을 나눠 적을 수 있어요
    faq_keywords:
    - 영수증 등록
    - 영수증 인식
    - 영수증 찍기
    - 가계부 영수증
  - id: 30-3
    task: 월 지출 한도 정하기
    steps:
    - 가계부 맨 위 "이번달 총 지출" 칸에서 [한도 설정하기]를 눌러요. 이미 한도가 있으면 [한도 설정]이에요
    - 한도 금액을 입력하고 [저장]을 눌러요
    notes:
    - 한도는 계정 전체 총액 하나예요
    - 한도의 90%를 넘으면 미리 알려주고, 초과하면 다시 알려줘요
    - 처음 저장하면 알림이 켜지고 설정에서 끌 수 있어요
    - 한도를 정하지 않았으면 "한도를 설정하면 지출을 관리할 수 있어요" 안내가 보여요
    faq_keywords:
    - 한도
    - 월 한도
    - 지출 한도
    - 얼마 썼는지 알림
  - id: 30-4
    task: 지출 수정·삭제하기
    steps:
    - 달력에서 날짜를 눌러 내역을 펼쳐요
    - PC는 지출 오른쪽 점 세 개 메뉴에서 [수정] 또는 [삭제]를 눌러요
    - 모바일은 지출을 눌러 "지출 상세"를 열고 [편집] 또는 [지출 삭제]를 눌러요
    - 삭제는 확인 창에서 한 번 더 눌러요
    notes:
    - 삭제하면 되돌릴 수 없어요
    faq_keywords:
    - 지출 수정
    - 지출 삭제
    - 가계부 고치기
  - id: 30-5
    task: 월별 통계 보기
    steps:
    - 맨 위 월 이동 화살표로 달을 바꿔요
    - 총 지출, 지난달 대비 증감, 한도 사용률을 봐요
    - 아래에서 카테고리별 지출, 반려동물별 지출, 이번달 주요 지출을 봐요
    notes:
    - 미래 달로는 이동할 수 없어요
    faq_keywords:
    - 얼마 썼어
    - 이번달 지출
    - 카테고리별 지출
    - 지출 통계
  - id: 30-6
    task: 전체 내역으로 가기
    steps:
    - 가계부 맨 아래 [이번달 전체 내역 보기]를 눌러요
    notes:
    - 보던 달이 그대로 전체 내역에 열려요
    faq_keywords:
    - 전체 내역
    - 지출 다 보기
- num: 31
  scr_id: SCR-MYP-031
  name: 가계부 전체 내역
  param: null
  routable: true
  path: /mypage/expenses/all
  login_required: true
  summary: 가계부의 지출을 월별로 전부 모아 보고 걸러 보고 한꺼번에 지우는 곳이에요.
  entry:
    pc:
    - 프로필 > [마이페이지] > 왼쪽 메뉴 [가계부] > 맨 아래 [이번달 전체 내역 보기]
    mobile:
    - 헤더의 [전체 메뉴] 맨 위 내 이름 > 하단 탭 [소비] > 맨 아래 [이번달 전체 내역 보기]
    other: []
  status: 정상
  not_ready: []
  tasks:
  - id: 31-1
    task: 달 바꿔서 지출 내역 보기
    steps:
    - 맨 위 월 이동 화살표를 눌러요
    - 먼 달은 연월 글자를 눌러 월을 골라요
    notes:
    - 한 번에 한 달만 볼 수 있어요
    - 합계 금액과 건수가 함께 보여요
    - 미래 달은 고를 수 없어요
    faq_keywords:
    - 전체 내역
    - 지출 내역 다 보여줘
    - 지난달 지출
  - id: 31-2
    task: 반려동물·카테고리로 걸러 보기
    steps:
    - '[반려동물] 또는 [카테고리] 목록에서 고르면 그 조건의 내역만 보여요'
    - 두 조건을 함께 쓸 수 있어요
    notes:
    - 기본값은 "전체"예요. 반려동물 목록에는 "공용"도 있어요
    faq_keywords:
    - 병원비만 보기
    - 반려동물별 지출 보기
    - 필터
  - id: 31-3
    task: 정렬 바꾸기
    steps:
    - 정렬 목록에서 [최신순] 또는 [금액순]을 골라요
    notes: []
    faq_keywords:
    - 금액 큰 순
    - 정렬
  - id: 31-4
    task: 지출 고치기
    steps:
    - PC에서 지출 항목을 누르면 바로 수정 창이 열려요
    - 모바일에서는 항목을 눌러 "지출 상세"를 열고 [편집]을 눌러요
    notes: []
    faq_keywords:
    - 지출 수정
    - 내역 고치기
  - id: 31-5
    task: 지출 여러 건 한꺼번에 삭제하기
    steps:
    - '[편집]을 눌러 편집 상태로 바꿔요'
    - 지울 항목 앞 체크박스를 골라요. [전체 선택]으로 이 페이지 전체를, [조회 결과 N건 모두 선택]으로 여러 페이지 전체를 고를 수 있어요
    - 여러 달을 지우려면 삭제 범위에서 [기간 지정] 또는 [전체 기간]을 골라요
    - 아래 선택 건수와 합계를 확인하고 [삭제]를 눌러요
    - 확인 창에서 한 번 더 [삭제]를 눌러요
    notes:
    - 삭제하면 되돌릴 수 없어요
    - 여러 달에 걸친 내역이면 확인 창에 안내가 나와요
    - 선택 해제는 한 번에 1,000건까지만 할 수 있어요
    - 편집 상태를 끝내려면 [편집 취소]를 눌러요. 달·필터·정렬을 바꿔도 풀려요
    faq_keywords:
    - 지출 삭제
    - 여러 개 삭제
    - 가계부 비우기
    - 전체 삭제
  - id: 31-6
    task: 더 불러보기
    steps:
    - PC는 아래 페이지 번호로 이동해요(한 페이지 20건)
    - 모바일은 아래로 내리면 다음 내역이 자동으로 불러와져요
    notes:
    - 다 불러오면 "이번 달 내역을 모두 불러왔어요"가 보여요
    faq_keywords:
    - 다음 페이지
    - 더 보기
- num: 32
  scr_id: SCR-MYP-040
  name: 회원정보 수정
  param: null
  routable: true
  path: /mypage/profile
  login_required: true
  summary: 프로필 사진, 닉네임, 휴대폰 번호, 비밀번호를 바꾸고 내 계정 정보를 보는 곳이에요.
  entry:
    pc:
    - 프로필 > [마이페이지] > 왼쪽 메뉴 [회원정보 수정]
    mobile:
    - 헤더의 [전체 메뉴] 맨 위 내 이름 > 제목 옆 ▾ 버튼의 [회원정보 수정] (폭 761~1100px에서만 보여요. 폭 760px 이하에는 아직 이 화면으로 가는 메뉴가 없어요)
    other: []
  status: 일부 준비 중
  not_ready:
  - '회원 탈퇴: [회원 탈퇴]를 눌러도 ''준비 중인 기능이에요'' 안내만 떠요. 곧 제공돼요'
  tasks:
  - id: 32-1
    task: 회원정보 수정 화면 들어가기
    steps:
    - 마이페이지 > [회원정보 수정]을 눌러요
    - 이메일로 가입한 경우 "본인 확인"에서 비밀번호를 입력하고 [확인]을 눌러요
    notes:
    - 카카오·네이버·구글 같은 간편 로그인 회원은 비밀번호가 없어 본인 확인 없이 바로 들어가요
    faq_keywords:
    - 회원정보
    - 본인 확인
    - 정보 수정 들어가기
  - id: 32-2
    task: 닉네임 바꾸기
    steps:
    - 닉네임 줄의 [수정]을 눌러요
    - 새 닉네임을 입력하고 [중복확인]을 눌러요
    - '"사용 가능한 닉네임입니다."가 나오면 [저장]을 눌러요'
    notes:
    - 최대 10글자, 한글·영문·숫자만 쓸 수 있어요
    - 이미 쓰는 닉네임이면 "이미 사용 중인 닉네임입니다."가 나와요
    faq_keywords:
    - 닉네임 변경
    - 별명 바꾸기
  - id: 32-3
    task: 휴대폰 번호 바꾸기
    steps:
    - 휴대폰 번호 줄의 [수정]을 눌러요
    - 새 번호를 입력하고 [중복확인]을 눌러요
    - 사용 가능하다고 나오면 [저장]을 눌러요
    notes:
    - 다른 회원이 쓰는 번호는 쓸 수 없어요
    faq_keywords:
    - 전화번호 변경
    - 휴대폰 변경
  - id: 32-4
    task: 비밀번호 바꾸기
    steps:
    - 비밀번호 줄의 [변경]을 눌러요
    - 현재 비밀번호, 새 비밀번호, 새 비밀번호 확인을 입력해요
    - '[저장]을 눌러요'
    notes:
    - 영문과 숫자를 함께 써서 8~64자, 공백 없이 입력해요
    - 이메일로 가입한 회원만 바꿀 수 있어요. 간편 로그인 회원에게는 이 줄이 없어요
    - 현재 비밀번호가 틀리면 "현재 비밀번호가 일치하지 않아요"가 나와요
    faq_keywords:
    - 비밀번호 변경
    - 비번 바꾸기
  - id: 32-5
    task: 프로필 사진 바꾸기
    steps:
    - 프로필 사진 옆 [사진 변경] 또는 연필 아이콘을 눌러요
    - 이미지를 골라요
    - 원래대로 하려면 [기본 이미지로]를 눌러요
    notes:
    - jpg·png·webp 이미지, 10MB 이하만 올릴 수 있어요
    - 간편 로그인 회원도 사진을 직접 올려야 해요
    faq_keywords:
    - 프로필 사진
    - 사진 변경
  - id: 32-6
    task: 회원 탈퇴하기
    steps:
    - 화면 맨 아래 [회원 탈퇴]를 눌러요
    notes:
    - 지금은 누르면 안내만 떠요. 곧 제공돼요
    faq_keywords:
    - 탈퇴
    - 회원 탈퇴
    - 계정 삭제
