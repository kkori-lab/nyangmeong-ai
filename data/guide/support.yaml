# 서비스 안내서 — 고객센터 (AI 매니저 사용법 안내, FN-AIM-002-02)
# 청크 = task 하나. id는 바꾸지 않는다(평가 정답표 tests/chat/data/guide_labels.json이 id로 가리킴)
# num·name·scr_id·param은 data/routes.snapshot.json과 같다(매핑표와는 scr_id·param으로 이음). 사람용 메모는 docs/guide-review.md
version: draft-0.1
updated: '2026-11-05'
screens:
- num: 7
  scr_id: SCR-CSC-001
  name: 공지사항 목록
  param: null
  routable: true
  path: /notices
  login_required: true
  summary: 냥멍케어의 새 소식과 서비스 안내를 모아 둔 곳이에요. 고객센터의 첫 화면이고, 1:1 문의도 이 고객센터 왼쪽 메뉴에서 들어가요.
  entry:
    pc:
    - 프로필 > [고객센터] (처음에 공지사항이 열려요)
    - 고객센터 왼쪽 메뉴 [공지사항]
    mobile:
    - 헤더의 [전체 메뉴] > 고객센터 > 하단 탭 [공지사항]
    other:
    - 화면 맨 아래 바닥글의 [공지사항]
    - 실종센터 오른쪽 안내의 [자세한 대처 요령 보기]
  status: 정상
  not_ready: []
  tasks:
  - id: 7-1
    task: 공지 보기와 검색
    steps:
    - 프로필 > [고객센터]로 들어가요(모바일은 [전체 메뉴] > 고객센터)
    - 목록에서 보고 싶은 공지를 눌러요
    - 찾는 공지가 있으면 위쪽 검색칸 "제목 또는 내용 검색"에 단어를 넣고 검색해요
    notes:
    - 한 쪽에 10개씩 보이고 "전체 n건"으로 개수가 나와요
    - 위에 고정된 공지는 [공지] 표시가 붙어 맨 위에 나와요
    - 검색 결과가 없으면 "검색한 공지가 없어요"와 [전체 공지 보기] 버튼이 나와요
    faq_keywords:
    - 고객센터
    - 공지
    - 공지사항
    - 점검 안내
    - 업데이트 소식
  - id: 7-2
    task: 1:1 문의 남기기
    steps:
    - 프로필 > [고객센터]를 눌러요(모바일은 [전체 메뉴] > 고객센터)
    - 고객센터 왼쪽 메뉴(모바일은 하단 탭)에서 [1:1 문의]를 눌러요
    - 이전에 남긴 문의가 없으면 바로 "새 문의 작성" 화면이 열려요. 있으면 목록 아래 [새 문의 작성]을 눌러요
    - 문의 유형을 골라요
    - 제목과 내용을 입력해요. 화면 캡처가 있으면 이미지를 올려요(선택)
    - '[문의 제출]을 눌러요'
    notes:
    - 문의 유형·제목·내용은 꼭 채워야 해요
    - 제목은 50자까지, 내용은 2,000자까지 쓸 수 있어요
    - 이미지는 최대 10장, JPG·PNG·WEBP, 한 장에 10MB까지예요
    - 답변이 등록되면 알림으로 알려 줘요
    - 쓰던 내용이 있는 채로 나가려 하면 "작성을 그만둘까요?" 확인 창이 떠요
    - 내가 남긴 문의는 나만 볼 수 있어요
    faq_keywords:
    - 문의
    - 1:1 문의
    - 문의하기
    - 문의 남기기
    - 고객센터 문의
    - 불편 신고
    - 오류 신고
    - 건의
  - id: 7-3
    task: 내 문의 확인·수정·삭제
    steps:
    - 고객센터 왼쪽 메뉴 [1:1 문의]로 가요
    - 위쪽 [전체] / [미답변] / [답변 완료] 중 보고 싶은 상태를 골라요
    - 문의를 누르면 내 문의 내용과 관리자 답변을 볼 수 있어요
    - 답변 전이면 [문의 수정] 또는 [삭제]를 누를 수 있어요
    notes:
    - 답변이 등록된 문의는 수정할 수 없어요
    - 삭제한 문의는 되돌릴 수 없어요
    - 답변을 기다리는 동안은 "아직 답변이 등록되지 않았어요"가 보여요
    faq_keywords:
    - 문의 내역
    - 문의 답변
    - 답변 확인
    - 문의 수정
    - 문의 삭제
- num: 33
  scr_id: SCR-CSC-002-01
  name: FAQ 목록
  param: null
  routable: true
  path: /faqs
  login_required: true
  summary: 자주 묻는 질문과 답을 한곳에서 볼 수 있어요. 질문을 누르면 그 자리에서 답이 펼쳐져요.
  entry:
    pc:
    - 프로필 > [고객센터] > 왼쪽 메뉴 [자주 묻는 질문]
    mobile:
    - 헤더의 [전체 메뉴] > 고객센터 > 하단 탭 [자주하는 질문]
    other:
    - 화면 맨 아래 바닥글의 [자주하는 질문]
    - 1:1 문의 작성 화면 위 안내의 [자주 묻는 질문]
  status: 정상
  not_ready: []
  tasks:
  - id: 33-1
    task: 자주 묻는 질문 찾아보기
    steps:
    - 위쪽 카테고리에서 [전체] / [이용방법] / [계정] / [신고 · 제재] / [기타] 중 하나를 골라요
    - 궁금한 질문을 눌러요
    - 질문 아래에 답(A)이 펼쳐져요. 다시 누르면 접혀요
    notes:
    - 한 쪽에 10개씩 보여요
    - 질문 여러 개를 동시에 펼쳐 둘 수 있어요
    faq_keywords:
    - 자주하는 질문
    - FAQ
    - 도움말
    - 자주 묻는 질문
  - id: 33-2
    task: FAQ 검색하기
    steps:
    - 검색칸 "궁금한 내용을 검색해보세요"에 단어를 입력해요
    - Enter를 누르거나 검색해요
    notes:
    - 카테고리와 검색어는 함께 적용돼요
    - 결과가 없으면 "찾는 질문이 없어요"와 [전체 질문 보기] 버튼이 나와요
    - 원하는 답이 없으면 왼쪽 메뉴 [1:1 문의]에서 직접 물어볼 수 있어요
    faq_keywords:
    - FAQ 검색
    - 질문 검색
    - 도움말 검색
- num: 34
  scr_id: SCR-CSC-001-02
  name: 공지 상세
  param: null
  routable: false
  path: /notices/:ntcMttrSn
  login_required: true
  summary: 공지 하나의 내용을 읽는 화면이에요. 오른쪽(또는 아래)에 최신 공지도 함께 보여요.
  entry:
    pc:
    - 공지사항 목록에서 공지를 누르면
    mobile:
    - 공지사항 목록에서 공지를 누르면
    other:
    - 공지 상세의 "최신 공지" 목록에서 다른 공지를 누르면
  status: 정상
  not_ready: []
  tasks:
  - id: 34-1
    task: 공지 내용 읽고 목록으로 돌아가기
    steps:
    - 공지 제목 아래 작성자(관리자)와 날짜를 확인하고 본문을 읽어요
    - 다른 공지는 "최신 공지" 목록에서 눌러요
    - '[목록으로]를 누르면 공지사항 목록으로 돌아가요'
    notes:
    - 공지는 관리자만 쓸 수 있고, 댓글이나 좋아요는 없어요
    faq_keywords:
    - 공지 상세
    - 공지 내용
    - 최신 공지
