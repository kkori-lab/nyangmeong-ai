# 서비스 안내서 — 건강기록 (AI 매니저 사용법 안내, FN-AIM-002-02)
# 청크 = task 하나. id는 바꾸지 않는다(평가 정답표 tests/chat/data/guide_labels.json이 id로 가리킴)
# num·name·scr_id·param은 data/routes.snapshot.json과 같다(매핑표와는 scr_id·param으로 이음). 사람용 메모는 docs/guide-review.md
version: draft-0.1
updated: '2026-11-05'
screens:
- num: 1
  scr_id: SCR-HLT-011
  name: 종합 건강기록
  param: null
  routable: true
  path: /health
  login_required: true
  summary: 반려동물의 진료·예방 이력, 검사 수치, 처방약, 관찰 기록, 첨부 자료를 한곳에서 모아 보는 화면이에요. 보기만 하는 화면이라 기록은 건강 일지·검진상세에서 남겨요.
  entry:
    pc:
    - 위쪽 메뉴 [건강기록] > [종합 건강기록] (건강기록을 누르면 가장 먼저 열려요)
    - 왼쪽 사이드 메뉴 [종합 건강기록]
    mobile:
    - 헤더의 [전체 메뉴] > 건강기록 > 종합 건강기록
    other:
    - 건강 일지·케어 캘린더 화면의 왼쪽 메뉴 [종합 건강기록]
  status: 정상
  not_ready: []
  tasks:
  - id: 1-1
    task: 반려동물 바꿔서 보기
    steps:
    - 화면 맨 위 요약 카드에서 반려동물 이름 탭을 눌러요
    - 고른 아이 기준으로 화면 전체가 바뀌어요
    notes:
    - 처음에는 등록된 첫 번째 반려동물이 보여요
    - 등록된 반려동물이 없으면 [반려동물 등록]을 눌러 마이페이지에서 먼저 등록해야 해요
    faq_keywords:
    - 반려동물 선택
    - 다른 아이 보기
    - 아이 바꾸기
    - 반려동물 전환
  - id: 1-2
    task: 건강 이력 타임라인 보기
    steps:
    - 첫 번째 탭 [진료 · 예방 이력]을 열어요 (처음부터 열려 있어요)
    - '[건강 이력 타임라인]에서 날짜순으로 진료와 예방 기록을 확인해요'
    - 항목을 누르면 그 검진의 상세 화면으로 가요
    - '[전체 보기]를 누르면 건강 일지의 검진기록 탭으로 가요'
    notes:
    - 이 화면에서는 보기만 할 수 있고 새 기록은 못 만들어요. 기록이 없으면 안내 속 링크로 건강 일지에서 검진기록을 등록해요
    faq_keywords:
    - 건강 이력
    - 타임라인
    - 진료 이력
    - 병원 다녀온 기록
    - 우리 애 상태
  - id: 1-3
    task: 예방접종·다음 검진 예정일 확인하기
    steps:
    - '[진료 · 예방 이력] 탭의 [예방 · 정기검진 이력] 카드를 봐요'
    - 예방접종 완료 이력, 다음 접종 예정일, 최근 검진일, 다음 검진 예정일이 나와요
    notes:
    - 예방접종·정기검진 기록이 하나도 없으면 [케어 캘린더에서 일정 등록하기] 링크가 보여요. 기록은 있는데 예정일만 없으면 "등록된 예정 일정 없음"이라고 나와요
    faq_keywords:
    - 예방접종 이력
    - 다음 접종
    - 다음 검진
    - 접종 예정일
  - id: 1-4
    task: 알레르기·기저질환 확인하고 고치기
    steps:
    - '[진료 · 예방 이력] 탭의 [알레르기 · 기저질환] 카드를 봐요'
    - 고치려면 카드의 [수정하러 가기](비어 있으면 [입력하러 가기])를 눌러요
    - 마이페이지 반려동물 관리로 이동해서 수정해요
    faq_keywords:
    - 알레르기
    - 기저질환
    - 질병 정보 수정
  - id: 1-5
    task: 관찰 기록·첨부 자료 보기
    steps:
    - 탭 [관찰 기록 · 첨부 자료]를 눌러요
    - 관찰 중인 항목의 첫 사진과 최근 사진을 나란히 비교해요
    - '[첨부 자료]에서 결과지·증명서·영상 사진을 눌러 미리 보거나 내려받아요'
    notes:
    - 이 화면에서는 올리거나 지울 수 없어요. 파일은 검진상세 [첨부 자료] 탭에서 올려요
    faq_keywords:
    - 첨부 자료
    - 관찰 기록
    - 결과지 보기
    - 증명서
- num: 11
  scr_id: SCR-HLT-003
  name: 케어 캘린더
  param: null
  routable: true
  path: /health/calendar
  login_required: true
  summary: 모든 반려동물의 병원·미용·케어 일정을 한 달력에 모아 보고, 일정을 등록하는 화면이에요. 위쪽 탭 [캘린더]와 [케어리스트]가 있어요.
  entry:
    pc:
    - 위쪽 메뉴 [건강기록] > [케어 캘린더]
    - 왼쪽 사이드 메뉴 [케어 캘린더]
    mobile:
    - 헤더의 [전체 메뉴] > 건강기록 > 케어 캘린더
    other:
    - 종합 건강기록의 [예방 · 정기검진 이력] 카드에서 [케어 캘린더에서 일정 등록하기]
  status: 정상
  not_ready: []
  tasks:
  - id: 11-1
    task: 이번 달 일정 한눈에 보기
    steps:
    - 탭 [캘린더]를 열어요 (처음부터 열려 있어요)
    - 달력의 ‹ › 로 달을 옮겨요
    - 날짜를 누르면 오른쪽(좁은 화면은 아래)에 그날 일정이 나와요
    notes:
    - 처음에는 오늘 날짜가 선택돼 있어요
    - 등록된 일정이 하나도 없으면 달을 옮길 수 없어요
    - 좁은 화면에서는 일정 이름 대신 점이나 짧은 막대로 표시돼요
    faq_keywords:
    - 일정 보여줘
    - 캘린더
    - 이번 달 일정
    - 접종 일정
    - 다음 접종
    - 병원 예약
  - id: 11-2
    task: 반려동물별로 일정 걸러 보기
    steps:
    - 달력 위 [표시 반려동물] 칩에서 보고 싶은 아이를 눌러요
    notes:
    - 처음에는 전체 반려동물이 보여요
    faq_keywords:
    - 반려동물별 일정
    - 일정 필터
    - 한 마리만 보기
  - id: 11-3
    task: 일정 등록하기
    steps:
    - 달력에서 날짜를 눌러요
    - '[새 일정 등록]을 눌러요 (좁은 화면은 ＋ 버튼)'
    - 반려동물과 일정 종류([병원] [미용·목욕] [케어·투약] [기타] 중 하나)를 골라요
    - 날짜를 확인하고 필요하면 시간을 넣어요
    - 병원이면 검진유형과 병원명을, 그 밖의 종류면 일정명을 입력해요
    - 필요하면 일정 메모를 적어요
    - '[저장하기]를 눌러요'
    notes:
    - 반려동물·일정 종류·날짜는 꼭 넣어야 해요. 시간과 메모는 안 넣어도 돼요
    - 병원명은 50자, 일정명은 40자, 메모는 200자까지 쓸 수 있어요
    - 일정 종류를 바꾸면 이미 적은 병원명·일정명이 지워져요
    - 검진유형은 정기검진·예방접종·질병진료·검사·기타 진료 중에서 골라요
    - 하루에 일정을 여러 개 등록할 수 있어요
    - 이미 다녀온 병원 기록은 일정이 아니라 건강 일지의 검진기록에 등록해요
    faq_keywords:
    - 일정 등록
    - 일정 추가
    - 접종 일정 등록
    - 병원 예약 등록
    - 미용 일정
    - 정기검진 일정
  - id: 11-4
    task: 일정 고치거나 지우기
    steps:
    - 날짜 상세나 [다가오는 케어 일정]에서 일정을 눌러요
    - 내용을 고치고 [일정 수정하기]를 눌러요
    - 지우려면 [일정 삭제하기]를 눌러요
    notes:
    - 병원 일정은 검진기록이 이미 연결돼 있으면 "검진기록 있음"으로 표시돼요
    - 일정을 지워도 연결된 검진기록은 남아요
    - 검진기록이 연결된 일정의 반려동물을 바꾸면 연동된 케어 항목도 함께 옮겨진다는 확인 창이 나와요
    faq_keywords:
    - 일정 수정
    - 일정 삭제
    - 일정 바꾸기
    - 일정 취소
  - id: 11-5
    task: 다가오는 일정 확인하기
    steps:
    - 캘린더 탭 오른쪽 아래(좁은 화면은 아래쪽)의 [다가오는 케어 일정]을 봐요
    - 일정을 누르면 수정 창이 열려요
    notes:
    - 오늘 이후 일정이 가까운 순으로 최대 3건 나와요
    - 없으면 "다가오는 일정이 없어요"라고 나와요
    faq_keywords:
    - 다음 일정
    - 다가오는 일정
    - 예정 일정
- num: 12
  scr_id: SCR-HLT-003
  name: 케어 캘린더 토탈 케어리스트
  param: null
  routable: true
  path: /health/calendar
  login_required: true
  summary: 케어 캘린더의 [케어리스트] 탭이에요. 귀 청소·양치·투약처럼 매일 또는 주기적으로 하는 관리 항목을 눌러 완료로 체크하고, 완료 기록을 날짜별로 모아 봐요.
  see: 11
  entry:
    pc:
    - 위쪽 메뉴 [건강기록] > [케어 캘린더] > 탭 [케어리스트]
    mobile:
    - 헤더의 [전체 메뉴] > 건강기록 > 케어 캘린더 > 탭 [케어리스트]
    other:
    - 메인 화면 "데일리 케어미션" 카드 오른쪽 위의 [토탈 케어리스트] 링크
  status: 정상
  not_ready: []
  tasks:
  - id: 12-1
    task: 케어 항목 완료 체크하기
    steps:
    - 카드 제목 왼쪽에서 반려동물을 골라요
    - 완료한 항목 줄을 눌러요
    - 다시 누르면 완료가 취소돼요
    notes:
    - 정기관리(주기가 있는 항목)가 위, 일상관리(매일 하는 항목)가 아래에 나와요
    - 처방약과 연동된 투약 항목은 하루 복용 횟수만큼 눌러서 n/N회로 체크하고, [마지막 1회 취소]로 되돌려요
    faq_keywords:
    - 케어리스트
    - 토탈 케어리스트
    - 데일리케어
    - 투약 체크
    - 양치 체크
    - 완료 체크
  - id: 12-2
    task: 관리 항목 추가하기
    steps:
    - '[관리 항목 추가]를 눌러요 (좁은 화면은 ＋ 버튼)'
    - 항목명을 입력해요
    - 필요하면 카테고리 대표 아이콘을 골라요
    - 반복 유형을 [매일] 또는 [주기]로 골라요
    - '[주기]면 며칠마다인지 넣고, 마지막으로 한 날을 알면 입력해요'
    - '[추가하기]를 눌러요'
    notes:
    - 항목명은 30자까지예요
    - 아이콘을 안 고르면 기본 아이콘으로 추가돼요
    - 마지막으로 한 날을 비우면 오늘부터 날짜를 세요
    faq_keywords:
    - 관리 항목 추가
    - 케어 항목 추가
    - 정기관리 추가
    - 할 일 추가
  - id: 12-3
    task: 관리 항목 고치거나 지우기
    steps:
    - 항목 줄 오른쪽 메뉴에서 [수정] 또는 [삭제]를 눌러요
    notes:
    - 내가 추가한 항목만 고치고 지울 수 있어요. 서비스 기본 항목은 이름·아이콘을 바꾸거나 지울 수 없고, 정기관리 기본 항목은 주기만 바꿀 수 있어요
    - 삭제하면 완료 기록도 함께 사라져요
    faq_keywords:
    - 관리 항목 수정
    - 관리 항목 삭제
    - 케어 항목 지우기
  - id: 12-4
    task: 메인 화면에 보일 항목 고르기
    steps:
    - 항목 줄 오른쪽 끝의 ★를 눌러요
    - 다시 누르면 해제돼요
    notes:
    - 메인 화면에는 6개까지 보일 수 있어요
    - ★는 바로 저장돼요. 따로 저장 버튼은 없어요
    faq_keywords:
    - 메인 표시
    - 별표
    - 메인에 보이게
    - 즐겨찾기
  - id: 12-5
    task: 심장사상충·구충제 주기 관리 추가하기
    steps:
    - 건강 일지 [검진기록] 탭에서 검진기록을 눌러 검진상세로 가요
    - 탭 [반복 예방]에서 [반복 예방 추가]를 눌러요
    - 저장하면 케어리스트에 주기대로 항목이 생겨요
    notes:
    - 심장사상충 예방과 구충제는 직접 추가하지 않고 이렇게 등록한 것이 자동으로 들어와요
    faq_keywords:
    - 심장사상충
    - 구충
    - 구충제
    - 반복 예방
  - id: 12-6
    task: 완료 기록 모아 보기
    steps:
    - 케어리스트 아래 [기록 내용]을 봐요
    - 날짜별로 완료한 항목이 쌓여 있어요
    notes:
    - 10일 넘게 쌓이면 아래에 페이지 번호가 나와요
    - 아직 완료한 항목이 없으면 "아직 완료한 케어가 없어요"라고 나와요
    faq_keywords:
    - 완료 기록
    - 기록 내용
    - 케어 기록
- num: 13
  scr_id: SCR-HLT-002
  name: 건강 일지
  param: null
  routable: true
  path: /health/diary
  login_required: true
  summary: 체중·식사량·음수량·배변·산책을 매일 기록하고, 피부나 눈처럼 계속 지켜볼 곳을 사진으로 남기고, 병원 검진기록을 관리하는 화면이에요. 탭이 [건강기록 변화] [지속 관찰] [검진기록] 세 개예요.
  entry:
    pc:
    - 위쪽 메뉴 [건강기록] > [건강 일지]
    - 왼쪽 사이드 메뉴 [건강 일지]
    mobile:
    - 헤더의 [전체 메뉴] > 건강기록 > 건강 일지
    other:
    - 종합 건강기록의 [건강 이력 타임라인] [전체 보기] 또는 빈 상태의 [건강 일지에서 검진기록 등록하기]
  status: 정상
  not_ready: []
  tasks:
  - id: 13-1
    task: 반려동물 고르기
    steps:
    - 탭 줄 옆의 반려동물 선택 목록에서 이름을 골라요
    - 고른 아이 기준으로 모든 탭이 바뀌어요
    notes:
    - 반려동물이 1마리뿐이면 선택 목록이 나오지 않아요
    faq_keywords:
    - 반려동물 선택
    - 다른 아이 기록
    - 아이 바꾸기
  - id: 13-2
    task: 오늘 기록 남기기(체중·식사량·음수량·배변·산책)
    steps:
    - 탭 [건강기록 변화]를 열어요
    - '[오늘의 기록] 카드의 [오늘 기록추가]를 눌러요'
    - '[오늘 기록하기]에서 종류(체중·식사량·음수량·배변상태·산책)를 골라요'
    - 시간과 값(무게 kg, 양 g·ml, 소요시간 분)을 입력해요. 배변상태는 상태를 골라요
    - '[등록하기]를 눌러요'
    notes:
    - 같은 종류를 하루에 여러 번 등록할 수 있어요
    - 값은 0보다 커야 등록돼요
    - 등록한 뒤에도 입력 창이 열려 있어 이어서 입력할 수 있어요
    - 배변 상태는 정상·딱딱함·무름·설사·변비 중에 골라요
    faq_keywords:
    - 오늘 기록
    - 체중 기록
    - 식사량
    - 음수량
    - 배변 기록
    - 산책 기록
    - 일상 기록
    - 건강 일지 쓰기
  - id: 13-3
    task: 변화 그래프와 최근 기록 보기
    steps:
    - 탭 [건강기록 변화]의 그래프에서 지표(체중·식사량·음수량·배변 상태·산책)를 골라요
    - 아래 [최근 건강기록] 표에서 날짜 줄을 눌러 그날 상세 기록을 봐요
    notes:
    - 그래프는 최근 14개 기록 기준이에요
    - 최근 건강기록은 최근 3일·7일·14일 중에서 골라 볼 수 있어요
    - 기록이 1건이면 그래프 대신 값만 보이고, 2건부터 그래프가 나와요
    faq_keywords:
    - 체중 그래프
    - 변화 보기
    - 최근 기록
    - 기록 수정
  - id: 13-4
    task: 지속 관찰 항목 등록하기
    steps:
    - 탭 [지속 관찰]을 열어요
    - '[관찰 항목 등록]을 눌러요 (좁은 화면은 [+ 등록])'
    - 관찰 항목 이름과 관찰 부위(대분류, 세부 위치는 선택)를 정해요
    - 관찰일을 고르고 사진을 올려요 ([촬영하기] 또는 [앨범에서 선택])
    - 크기·변화·메모는 원하면 적어요
    - 저장해요
    notes:
    - 항목 이름·부위·관찰일·사진은 꼭 필요하고 크기·변화·메모는 선택이에요
    - 관찰일은 오늘 이후로 고를 수 없어요
    - 사진은 jpg·jpeg·png·webp, 한 장 10MB 이하예요
    - 이미 있는 항목에 다음 회차를 더하려면 항목을 열어 [관찰 기록 추가 · N회차]를 눌러요
    faq_keywords:
    - 지속 관찰
    - 관찰 기록
    - 관찰 항목 등록
    - 피부 점 관찰
    - 상처 관찰
    - 사진으로 변화 보기
- num: 14
  scr_id: SCR-HLT-002
  name: 건강 일지 검진기록
  param: null
  routable: true
