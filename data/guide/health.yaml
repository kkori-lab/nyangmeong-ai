    task: 검진기록 직접 입력해서 등록하기
    steps:
    - 탭 [검진기록]을 열어요
    - '[검진기록 등록]을 눌러요 (좁은 화면은 [+ 등록])'
    - '[직접 입력하기]를 골라요'
    - 반려동물, 검진일, 동물병원명, 검진 종류를 입력해요
    - 필요하면 검진 내용과 검진 메모를 적어요
    - 저장해요
    notes:
    - 반려동물·검진일·동물병원명·검진 종류는 꼭 필요해요. 검진 내용·메모는 선택이에요
    - 병원명은 50자, 검진 내용은 500자, 메모는 200자까지예요
    - 앞으로 갈 병원 예정은 여기가 아니라 케어 캘린더에서 일정으로 등록해요
    - 저장하면 케어 캘린더에도 표시돼요. 같은 날 같은 아이의 병원 일정이 있으면 자동으로 연결돼요
    faq_keywords:
    - 검진기록 추가
    - 검진기록 등록
    - 병원 다녀온 기록
    - 검진 이력
    - 진료 내역
  - id: 14-2
    task: 영수증·약봉투로 검진기록 등록하기
    steps:
    - 탭 [검진기록]에서 [검진기록 등록]을 눌러요
    - '[영수증으로 등록하기]를 골라요'
    - 대상 반려동물을 확인하고 영수증이나 약봉투 사진을 [파일 선택]으로 올려요(폭 1100px 이하 화면에서는 [촬영하기]도 보여요)
    - '[분석 요청]을 눌러 기다려요 (약 15초)'
    - '[인식 결과 확인]에서 검진일·병원명·검진 종류·처방 약품을 확인하고 고쳐요'
    - '[저장하기]를 눌러요'
    notes:
    - 사진은 jpg·jpeg·png·webp, 한 장 10MB 이하예요
    - AI가 읽은 결과라 틀릴 수 있어요. 저장 전에 꼭 확인해요
    - 읽지 못하면 [직접 입력]이나 [다시 올리기]를 할 수 있어요
    - 영수증에 여러 마리가 있으면 반려동물별 탭으로 나눠 저장돼요
    - 영수증 금액이 있으면 가계부에도 함께 기록하도록 고를 수 있어요
    - '[다시 촬영하기]를 누르면 입력한 내용을 버리고 처음 단계로 돌아가요'
    faq_keywords:
    - 병원 영수증
    - 약봉투
    - 진료비 영수증
    - 영수증으로 검진 등록
    - 영수증 등록
    - 영수증 올리기
  - id: 14-3
    task: 검진기록 연도별로 찾고 지우기
    steps:
    - 제목 옆 연도 선택에서 보고 싶은 해를 골라요
    - '[올해 검진] [예방접종] 칩으로 걸러 봐요'
    - 병원 이름을 누르면 검진상세 화면으로 가요
    - 지우려면 줄의 [삭제]를 누르고 확인 창에서 [삭제하기]를 눌러요
    notes:
    - 한 페이지에 10건씩 나와요
    - 검진기록을 지우면 그 검진에서 만든 투약·반복 예방 항목도 케어리스트에서 사라져요(완료 기록은 남아요)
    faq_keywords:
    - 검진기록 삭제
    - 검진 이력 보기
    - 연도별 검진
    - 검진 목록
  - id: 14-4
    task: 검진기록 고치기
    steps:
    - 검진기록 줄에서 병원 이름을 눌러 검진상세로 가요
    - 기본정보 카드에서 내용을 고쳐요
