    mobile:
    - 헤더의 [전체 메뉴] > 건강기록 > 건강 일지 > 탭 [검진기록]
    other:
    - 종합 건강기록 빈 상태의 [건강 일지에서 검진기록 등록하기]
    - AI 대화창의 영수증 인식 결과에서 [확인 후 저장] 또는 [직접 입력]
  status: 정상
  not_ready: []
  tasks:
