# 서비스 안내서 — 공통 레이아웃(헤더·AI 버튼·알림·메뉴)과 설정·채팅 (AI 매니저 사용법 안내, FN-AIM-002-02)
# 청크 = task 하나. id는 바꾸지 않는다(평가 정답표 tests/chat/data/guide_labels.json이 id로 가리킴)
# num·name·scr_id·param은 data/routing.yaml과 같다. 사람용 메모는 docs/guide-review.md
version: draft-0.1
updated: '2026-11-05'
common:
- id: C-1
  task: AI 매니저 대화창 열기
  steps:
  - 화면 오른쪽 아래에 떠 있는 AI 버튼(로봇 모양)을 눌러요
  - 새 창이 열리고 AI 매니저와 대화할 수 있어요
  - 창이 이미 열려 있으면 새로 만들지 않고 그 창을 앞으로 가져와요
  notes:
  - 팝업이 막혀 있으면 "팝업이 차단되어 AI 매니저를 열 수 없어요." 안내와 [다시 열기]가 떠요. 브라우저에서 팝업을 허용한 뒤 [다시 열기]를 눌러요
  - 처음 방문하면 버튼 옆에 "AI 매니저" 말풍선이 잠깐 보여요
  - 메인 화면에는 떠 있는 AI 버튼이 없어요. 대신 가운데 질문창에 입력해서 물어봐요
  - 플레이스 화면에도 떠 있는 AI 버튼이 없어요. 다른 화면으로 가거나 메인의 질문창을 써요
  faq_keywords:
  - AI 매니저 열기
  - AI 버튼
  - 챗봇 어디
  - 대화창 열기
  - AI에게 물어보기
- id: C-2
  task: 모바일에서 AI 버튼 접고 펴기
  steps:
  - 휴대폰 화면(폭 760px 미만)에서는 AI 버튼이 처음에 오른쪽 가장자리에 접혀 있어요
  - 가장자리의 화살표 버튼(AI 매니저 펼치기)을 누르면 버튼이 펼쳐져요
  - 펼친 버튼을 오른쪽으로 끌었다 놓으면 다시 접혀요
  notes:
  - 버튼이 접혀 있으면 눌러도 대화창이 열리지 않아요. 먼저 펼쳐야 해요
  faq_keywords:
  - AI 버튼 안 보여요
  - AI 버튼 접힘
  - 모바일 AI
- id: C-3
  task: 알림 확인하기
  steps:
  - 화면 위 헤더 오른쪽의 알림 종 아이콘을 눌러요
  - 위쪽 탭 [전체] [케어] [커뮤니티] [안내]로 종류를 골라요
  - 알림을 누르면 읽음 처리되고 해당 화면으로 이동해요
  - 종 아이콘을 다시 누르거나 바깥을 누르거나 Esc 키를 누르면 닫혀요
  notes:
  - 종 아이콘의 숫자는 읽지 않은 알림 수예요
  - 목록에는 최신 알림이 최대 5건까지 보여요
  - 알림 창을 열기만 해서는 읽음 처리되지 않아요. 알림을 눌러야 읽음이 돼요
  - 알림이 없으면 "새 알림이 없어요"가 보여요
  - 펫돌봄 거래 알림을 누르면 화면 이동 없이 그 채팅방이 열려요
  - 어떤 알림을 받을지는 프로필 > [설정]에서 정해요
  faq_keywords:
  - 알림 확인
  - 알림 종
  - 새 알림
  - 읽지 않은 알림
  - 알림 어디서 봐
- id: C-4
  task: 로그아웃하기
  steps:
  - PC에서는 헤더 오른쪽 프로필 아이콘을 눌러 [로그아웃]을 골라요
  - 모바일(폭 1100px 이하)에서는 헤더의 [전체 메뉴](햄버거)를 열고 맨 아래 [로그아웃]을 눌러요
  - '"로그아웃하시겠어요?" 창에서 [로그아웃]을 눌러요'
  notes:
  - 로그아웃하면 열려 있던 AI 매니저 창과 채팅 창도 닫히고 첫 화면으로 돌아가요
  - 실패하면 "로그아웃하지 못했어요. 잠시 후 다시 시도해 주세요." 안내가 떠요. 잠시 뒤 다시 눌러요
  faq_keywords:
  - 로그아웃
  - 로그 아웃
  - 계정 나가기
  - 로그인 해제
- id: C-5
  task: 모바일에서 메뉴 찾기
  steps:
  - 화면 폭이 1100px 이하이면 상단 메뉴 대신 헤더 오른쪽의 [전체 메뉴](햄버거)가 보여요
  - '[전체 메뉴]를 누르면 건강기록·플레이스·커뮤니티의 메뉴와 고객센터·설정이 한꺼번에 나와요'
  - 원하는 메뉴를 누르면 이동하면서 메뉴가 닫혀요
  - 맨 위의 내 이름 부분을 누르면 마이페이지로 가요
  notes:
  - 폭 760px 미만이면 건강기록·커뮤니티·마이페이지·고객센터·설정 화면 아래에 하단 탭이 따로 나와요. 메인과 플레이스에는 하단 탭이 없어요
  - 닫을 때는 오른쪽 위 X, 바깥의 어두운 부분, Esc 키를 쓸 수 있어요
  - 알림 종과 채팅 아이콘은 모바일에서도 헤더에 그대로 있어요
  faq_keywords:
  - 모바일 메뉴
  - 햄버거 메뉴
  - 메뉴 어디
  - 전체 메뉴
  - 메뉴 찾기
- id: C-6
  task: 헤더 메뉴로 다른 화면 가기 (PC)
  steps:
  - 위쪽 [건강기록] [플레이스] [커뮤니티]에 마우스를 올려요
  - 아래에 2차 메뉴가 나오면 원하는 항목을 눌러요
  - 프로필 아이콘을 누르면 마이페이지·고객센터·설정·로그아웃이 나와요
  - 왼쪽 위 로고를 누르면 메인으로 가요
  faq_keywords:
  - 메뉴 위치
  - 상단 메뉴
  - 화면 이동
  - 마이페이지 가는 법
screens:
- num: 9
  scr_id: SCR-COM-008
  name: 설정
  param: null
  routable: true
  path: /settings/notifications
  login_required: true
  summary: 어떤 알림을 어디로 받을지 켜고 끄는 화면이에요. 알림 설정만 있어요.
  entry:
    pc:
    - 헤더 프로필 아이콘 > [설정]
    mobile:
    - 헤더 [전체 메뉴](햄버거) > 설정
    other:
    - 모바일(760px 미만)에서는 설정 화면 하단 탭 [알림 설정]
    - AI 매니저에게 "알림 꺼줘"라고 말했을 때 안내되는 화면
  status: 정상
  not_ready: []
  tasks:
  - id: 9-1
    task: 알림 켜고 끄기
    steps:
    - 프로필 > [설정]으로 가요(모바일은 [전체 메뉴] > 설정)
    - 끄거나 켜고 싶은 항목의 스위치를 눌러요
    - 화면 아래쪽 [저장]을 눌러요
    notes:
    - 스위치를 바꾸기만 해서는 적용되지 않아요. [저장]을 눌러야 적용돼요
    - 바꾼 것이 없으면 [저장]이 눌리지 않아요
    - 저장하면 "저장했어요" 안내가 떠요
    - 알림을 끄면 그 알림이 새로 만들어지지 않아요. 이미 받은 알림은 알림함에 남아요
    faq_keywords:
    - 알림 꺼줘
    - 알림 켜줘
    - 알림 설정
    - 수신 해제
    - 알림 끄기
  - id: 9-2
    task: 이메일·앱 알림함 채널 정하기
    steps:
    - '''알림 채널''에서 [이메일로 받기]와 [앱 알림함으로 받기] 스위치를 켜거나 꺼요'
    - '[저장]을 눌러요'
    notes:
    - 이메일 주소는 가입한 이메일로 정해져 있어서 바꿀 수 없어요
    - 두 채널을 모두 끄면 어떤 알림도 받지 못해요
    faq_keywords:
    - 이메일 알림
    - 메일 수신 해제
    - 앱 알림만
    - 알림 채널
  - id: 9-3
    task: 케어 일정 알림과 미리 알림 시점 정하기
    steps:
    - '''케어 일정''에서 [예정일 알림] 스위치를 켜요'
    - '[당일] [1일 전] [3일 전] [7일 전] 중 받고 싶은 시점을 눌러요(여러 개 선택 가능)'
    - '[저장]을 눌러요'
    notes:
    - 미리 알림 시점은 하나 이상 골라야 해요. 비우고 저장하면 "미리 알림 시점을 하나 이상 골라 주세요" 안내가 떠요
    - 사전 알림은 매일 오전 9시에 보내져요. 이후에 등록하거나 바꾼 오늘 알림은 보내지지 않아요
    - 예방접종·정기검진·반복 예방 예정일 알림이에요
    faq_keywords:
    - 접종 알림
    - 예정일 알림
    - 며칠 전 알림
    - 케어 알림 시간
  - id: 9-4
    task: 펫돌봄·댓글·실종 제보 알림 정하기
    steps:
    - '''펫돌봄 거래 상태''의 [거래 상태 알림]을 켜거나 꺼요'
    - '''커뮤니티''의 [댓글 알림]과 [실종 제보 글 만료 예고]를 켜거나 꺼요'
    - '[저장]을 눌러요'
    notes:
    - 거래 상태 알림은 매칭 요청·수락·취소, 돌봄 완료·확인 때 와요
    - 실종 제보 글 만료 예고는 만료 7일 전과 전날에 와요
    - 새 채팅 메시지는 알림이 아니라 헤더 채팅 아이콘의 숫자로만 알려줘요
    faq_keywords:
    - 댓글 알림
    - 펫돌봄 알림
    - 실종 알림
    - 거래 알림
  - id: 9-5
    task: 가계부 지출 한도 알림 켜기
    steps:
    - '''가계부''의 [월 지출 한도 초과 알림]을 켜요'
    - 월 한도를 아직 정하지 않았다면 안내가 나와요. [가계부로 이동]을 눌러 한도를 먼저 정해요
    - '[저장]을 눌러요'
    notes:
    - 월 한도 금액은 설정이 아니라 가계부 화면에서 정해요
    faq_keywords:
    - 지출 한도 알림
    - 가계부 알림
    - 한도 초과
  - id: 9-6
    task: 끌 수 없는 알림 알아보기
    steps:
    - 화면 아래 '항상 받는 알림'을 확인해요
    notes:
    - 공동양육 초대·결과·연동 해제, 캐릭터 생성 완료, 1:1 문의 답변, 공지사항은 "끌 수 없음"이에요
    faq_keywords:
    - 꺼지지 않는 알림
    - 공지 알림 끄기
    - 항상 받는 알림
- num: 10
  scr_id: SCR-COM-009
  name: 채팅
  param: null
  routable: true
  move_type: MODAL
  path: /chat
  login_required: false
  summary: 다른 보호자와 나누는 채팅 창이에요. 헤더 채팅 아이콘을 누르면 지금 화면 위에 창으로 뜨고, 새 창으로 띄우면 /chat 주소의 별도 창으로 열려요.
  entry:
    pc:
    - 헤더 오른쪽 채팅 아이콘 (안 읽은 채팅이 있으면 숫자가 붙어요)
    mobile:
    - 헤더 오른쪽 채팅 아이콘 (창이 헤더 아래 전체 화면으로 열려요)
    other:
    - 알림 창의 펫돌봄 거래 알림을 누르면 그 채팅방이 열려요
    - 우리동네 펫돌봄 글의 채팅 버튼
    - 채팅 창 위쪽 [새 창으로 띄우기]
  status: 가짜 응답(연결 전)
  not_ready:
  - '채팅방·메시지·거래 카드: 아직 서버와 연결되지 않은 연습용 데이터예요. 실제 상대와의 대화는 곧 제공돼요'
  tasks:
  - id: 10-1
    task: 채팅 열기
    steps:
    - 헤더 오른쪽 채팅 아이콘을 눌러요
    - 채팅 창이 뜨고 마지막으로 보던 채팅방이 열려 있어요
    notes:
    - 채팅 아이콘의 숫자는 안 읽은 메시지 수예요(99를 넘으면 99+)
    - 이미 열려 있으면 다시 눌러도 그대로예요
    - 다른 화면으로 이동하면 펼쳐진 채팅 창은 닫혀요. 최소화해 두면 보던 방을 기억해요
    - 채팅이 연결되기 전의 연습용 화면이라 실제 사람과 대화되지 않아요
    faq_keywords:
    - 채팅 열기
    - 채팅 어디
    - 메시지
    - 쪽지
    - 대화 확인
  - id: 10-2
    task: 채팅방 고르고 걸러 보기
    steps:
    - 왼쪽 목록에서 상대와 마지막 메시지를 보고 방을 눌러요
    - 위쪽 [전체] [내 글] [지원한 글] 탭으로 나눠 봐요
    - '''안 읽음만'' 체크를 켜면 안 읽은 채팅만 보여요'
    notes:
    - 모바일(760px 이하)은 목록과 대화가 한 칸씩 번갈아 보여요
    - 채팅이 없으면 "채팅이 없어요" 등 안내가 떠요
    faq_keywords:
    - 채팅 목록
    - 안 읽은 채팅
    - 내 글 채팅
    - 지원한 글 채팅
  - id: 10-3
    task: 메시지와 사진 보내기
    steps:
    - 아래 '메시지를 입력하세요' 칸에 글을 쓰고 [전송]을 눌러요
    - 사진은 [사진 첨부] 아이콘으로 고르고 [전송]을 눌러요
    notes:
    - 사진은 JPG·PNG·WEBP만 가능하고 장당 10MB까지 보낼 수 있어요
    - 주소 공유 아이콘은 매칭이 완료된 뒤에만 쓸 수 있어요("매칭이 완료된 뒤 주소를 공유할 수 있어요")
    - 보내지 못하면 "메시지를 보내지 못했어요"와 [다시 보내기]가 떠요
    faq_keywords:
    - 메시지 보내기
    - 사진 보내기
    - 주소 공유
    - 채팅 전송
  - id: 10-4
    task: 새 창으로 띄우기·최소화·닫기
    steps:
    - 창 위쪽 [새 창으로 띄우기]를 누르면 채팅이 별도 창으로 열리고 지금 창은 닫혀요
    - '[최소화]는 창을 숨기고 보던 방을 기억해요'
    - '[닫기]나 Esc 키로 닫아요'
    notes:
    - 팝업이 막혀 있으면 "팝업이 차단돼 새 창을 열지 못했어요"가 뜨고 채팅 창은 그대로 남아요
    faq_keywords:
    - 채팅 새 창
    - 채팅 최소화
    - 채팅 닫기
    - 채팅 크게
