# 서비스 안내서 — 커뮤니티 (AI 매니저 사용법 안내, FN-AIM-002-02)
# 청크 = task 하나. id는 바꾸지 않는다(평가 정답표 tests/chat/data/guide_labels.json이 id로 가리킴)
# num·name·scr_id·param은 data/routes.snapshot.json과 같다(매핑표와는 scr_id·param으로 이음). 사람용 메모는 docs/guide-review.md
version: draft-0.1
updated: '2026-11-04'
screens:
- num: 4
  scr_id: SCR-CMU-001-01
  name: 펫이야기 목록
  param: null
  routable: true
  path: /community
  login_required: true
  summary: 반려동물을 키우는 사람들이 정보와 일상을 글로 나누는 게시판이에요. 펫정보와 펫일상 두 가지 글이 함께 모여 있어요.
  entry:
    pc:
    - 위쪽 메뉴 [커뮤니티] > [펫이야기]
    mobile:
    - 헤더의 [전체 메뉴] > 커뮤니티 > 펫이야기
    other:
    - 커뮤니티의 다른 화면(우리동네 펫돌봄·실종센터·펫뉴스) 왼쪽 메뉴의 [펫이야기]
    - 펫이야기 글 상세의 [목록으로]
  status: 정상
  not_ready: []
  tasks:
  - id: 4-1
    task: 펫이야기 글 둘러보기
    steps:
    - 위쪽 탭에서 [전체] / [펫정보] / [펫일상] 중 보고 싶은 글 종류를 골라요
    - 오른쪽 위 정렬 상자에서 [최신순] 또는 [인기순]을 골라요
    - 보고 싶은 글을 누르면 글 상세로 가요
    - 아래쪽 쪽 번호로 다음 글 묶음을 볼 수 있어요
    notes:
    - 한 쪽에 10개씩 보여요
    - '탭과 정렬은 함께 적용돼요(예: 펫일상 + 인기순)'
    - 인기 글은 제목 옆 [인기] 표시로만 구분해요(맨 위에 고정되지 않아요)
    faq_keywords:
    - 커뮤니티
    - 게시판
    - 펫이야기
    - 글 보고 싶어
    - 인기글
    - 최신글
  - id: 4-2
    task: 글 검색하기
    steps:
    - 오른쪽 위 검색칸 "제목 또는 내용 검색"에 단어를 입력해요
    - Enter를 누르거나 검색 버튼을 눌러요
    notes:
    - 결과가 없으면 "검색 결과가 없어요" 안내와 [전체 글 보기] 버튼이 나와요
    faq_keywords:
    - 글 검색
    - 게시글 찾기
    - 펫이야기 검색
  - id: 4-3
    task: 글쓰기
    steps:
    - 목록 아래쪽 [글쓰기]를 눌러요
    - 카테고리(펫정보 / 펫일상) 중 하나를 골라요
    - 제목과 내용을 입력해요
    - 사진을 올리고 싶으면 이미지 첨부 칸에서 올려요(선택)
    - '[등록]을 눌러요'
    notes:
    - 카테고리·제목·내용은 꼭 채워야 해요
    - 제목은 50자까지, 내용은 2,000자까지 쓸 수 있어요
    - 사진은 최대 10장, JPG·PNG·WEBP, 한 장에 10MB까지예요
    - 정보·꿀팁은 펫정보, 사진·일상 이야기는 펫일상을 골라 달라고 안내해요
    - 쓰던 내용이 있는 채로 나가려 하면 나가기 확인 창이 떠요
    faq_keywords:
    - 글쓰기
    - 게시글 작성
    - 글 올리기
    - 사진 올리기
  - id: 4-4
    task: 오른쪽 안내 보기(오늘의 한마디·인기 포토·건강 팁)
    steps:
    - 목록 오른쪽(화면이 좁으면 목록 아래)에서 오늘의 한마디, 인기 포토, 오늘의 건강 팁을 봐요
    - 아래 [내 펫 건강 체크하기]를 누르면 건강기록으로 가요
    notes: []
    faq_keywords:
    - 오늘의 한마디
    - 인기 포토
    - 건강 팁
- num: 22
  scr_id: SCR-CMU-001-02
  name: 펫이야기 글 상세
  param: null
  routable: false
  path: /community/posts/:pstSn
  login_required: true
  summary: 펫이야기 글 하나를 읽고 좋아요, 공유, 신고, 댓글을 남기는 화면이에요.
  entry:
    pc:
    - 펫이야기 목록에서 글을 누르면
    mobile:
    - 펫이야기 목록에서 글을 누르면
    other:
    - 글 상세 오른쪽 "펫이야기 최신글" 목록에서 다른 글을 누르면
    - 펫이야기 오른쪽의 오늘의 건강 팁·인기 포토 글을 누르면
  status: 정상
  not_ready: []
  tasks:
  - id: 22-1
    task: 좋아요 누르기와 취소
    steps:
    - 글 아래쪽 하트 [좋아요]를 눌러요
    - 한 번 더 누르면 좋아요가 취소돼요
    notes: []
    faq_keywords:
    - 좋아요
    - 추천
    - 좋아요 취소
  - id: 22-2
    task: 글 공유하기
    steps:
    - 글 아래쪽 [공유하기]를 눌러요
    - '[링크 복사]를 누르면 글 주소가 복사돼요'
    - 기기가 지원하면 [다른 앱으로 공유]도 나와요
    notes: []
    faq_keywords:
    - 공유
    - 링크 복사
    - 글 공유
  - id: 22-3
    task: 글 신고하기
    steps:
    - 글 아래쪽 [신고]를 눌러요(화면이 좁으면 깃발 아이콘)
    - 신고 사유를 하나 골라요(스팸 · 광고성 / 욕설 · 비방 / 음란물 · 유해 콘텐츠 / 개인정보 노출 / 사기 · 허위 정보 / 기타)
    - 상세 내용을 적어요(선택)
    - '[신고 제출]을 눌러요'
    notes:
    - 신고 사유는 꼭 골라야 해요
    - '[기타]를 고르면 상세 내용을 꼭 적어야 해요(최대 500자)'
    - 제출하면 "신고가 접수되었어요" 안내가 나와요
    faq_keywords:
    - 신고
    - 글 신고
    - 게시글 신고
    - 부적절한 글
  - id: 22-4
    task: 댓글·답글 달기
    steps:
    - 글 아래 댓글 입력칸에 내용을 써요
    - '[댓글 등록]을 눌러요'
    - 댓글에 답하려면 그 댓글 아래 [답글쓰기]를 눌러 쓰고 [답글 등록]을 눌러요
    notes:
    - 댓글은 500자까지 쓸 수 있고 글자 수가 보여요
    - 답글에 단 답글은 원래 댓글 묶음 안에 이어서 보여요
    faq_keywords:
    - 댓글
    - 대댓글
    - 답글
    - 댓글 쓰기
  - id: 22-5
    task: 댓글 삭제와 댓글 신고
    steps:
    - 내 댓글은 댓글 아래 [삭제]를 누르고 확인 창에서 삭제해요
    - 다른 사람 댓글은 오른쪽 점 세 개 메뉴 > [신고하기]를 눌러 사유를 골라 제출해요
    notes:
    - 삭제한 댓글은 "삭제된 댓글입니다"로 바뀌고 답글은 남아요
    faq_keywords:
    - 댓글 삭제
    - 댓글 신고
  - id: 22-6
    task: 내 글 수정·삭제
    steps:
    - 내가 쓴 글 위쪽 오른쪽의 [수정] 또는 [삭제]를 눌러요
    - 수정은 내용을 고치고 [저장]을 눌러요
    - 삭제는 확인 창에서 [삭제]를 눌러요
    notes:
    - 내가 쓴 글에만 [수정]·[삭제]가 보여요
    - 삭제한 글은 되돌릴 수 없어요
    faq_keywords:
    - 글 수정
    - 글 삭제
    - 게시글 삭제
    - 내 글 지우기
- num: 23
  scr_id: SCR-CMU-002
  name: 실종센터
  param: null
  routable: true
  path: /community/missing
  login_required: true
  summary: 잃어버린 반려동물을 함께 찾는 게시판이에요. 실종 글을 올리고, 비슷한 아이를 봤다면 댓글로 제보해요.
  entry:
    pc:
    - 위쪽 메뉴 [커뮤니티] > [실종센터]
    mobile:
    - 헤더의 [전체 메뉴] > 커뮤니티 > 실종센터
    other:
    - 커뮤니티 다른 화면 왼쪽 메뉴의 [실종센터]
    - 실종 글 상세의 [목록으로]
  status: 정상
  not_ready: []
  tasks:
  - id: 23-1
    task: 실종·찾았어요 글 둘러보기와 찾기
    steps:
    - 위쪽 탭에서 [전체] / [실종] / [찾았어요]를 골라요
    - 검색칸 "지역, 품종, 특징으로 검색"에 단어를 넣고 검색해요
    - '[상세 필터]를 열어 실종 지역(전북 시·군·구와 읍·면·동), 반려동물(강아지·고양이), 실종 기간을 골라요'
    - 카드를 누르면 상세 화면으로 가요
    notes:
    - 한 쪽에 12개씩 카드로 보여요
    - 전북 지역만 고를 수 있어요
    - '[내 글만 보기]를 체크하면 내가 올린 글만 보여요'
    - '[필터 초기화]로 조건을 모두 풀 수 있어요'
    faq_keywords:
    - 실종
    - 잃어버렸어
    - 실종센터
    - 찾아주세요
    - 제보
    - 실종 글 찾기
  - id: 23-2
    task: 실종 글 등록하기(실종 제보 등록)
    steps:
    - 목록 아래쪽 [실종 등록하기]를 눌러요
    - 반려동물 종류, 이름, 털 색상, 품종, 특징(선택)을 입력해요
    - 마지막 목격 날짜·시간을 고르고 [장소 찾기]에서 목격 장소를 골라요
    - 제목, 상세 설명, 연락처(전화번호)를 입력해요
    - 사진을 올려요(선택)
    - 공개 동의에 체크하고 [등록]을 눌러요
    notes:
    - 이름·털 색상은 20자, 특징은 40자, 제목은 50자, 상세 설명은 2,000자까지예요
    - 실종 지역은 따로 입력하지 않고 고른 목격 장소로 자동 정해져요
    - 장소는 전북 지역만 고를 수 있어요
    - 연락처는 게시글에 공개돼요('찾았어요'로 바꾸면 보이지 않아요)
    - 사진은 최대 10장, JPG·PNG·WEBP, 한 장에 10MB까지예요
    - 아직 오지 않은 날짜·시간은 고를 수 없어요
    faq_keywords:
    - 실종 등록
    - 실종 신고
    - 강아지 잃어버렸어요
    - 고양이 잃어버렸어요
    - 실종 제보
  - id: 23-3
    task: 실종 글에 목격 제보하기(댓글)
    steps:
    - 실종 글 상세에서 아래 "제보 · 댓글" 입력칸에 목격한 장소와 시간을 적어요
    - '[댓글 등록]을 눌러요'
    notes:
    - 오른쪽 "○○를 보셨나요?" 카드의 [댓글로 제보하기]를 누르면 댓글 입력으로 이동해요
    - 댓글은 500자까지예요
    faq_keywords:
    - 목격 제보
    - 봤어요
    - 실종 댓글
    - 제보하기
  - id: 23-4
    task: 내 글 '찾았어요'로 바꾸기
    steps:
    - 내 실종 글 상세로 가요
    - 오른쪽 "○○를 찾으셨나요?" 카드의 [찾았어요]를 눌러요
    - 확인 창에서 [찾았어요]를 눌러요
    notes:
    - 누르면 "찾았어요" 댓글이 자동으로 달려요
    - 바꾼 뒤에는 본문·사진·연락처·위치·댓글이 다른 사람에게 공개되지 않고, 다시 '실종'으로 되돌릴 수 없어요
    faq_keywords:
    - 찾았어요
    - 찾았어
    - 실종 종료
    - 돌아왔어요
  - id: 23-5
    task: 게시 기간 30일 늘리기
    steps:
    - 내 실종 글 상세 오른쪽 카드에서 [30일 더 게시하기]를 눌러요
    - 확인 창에서 [30일 더 게시하기]를 눌러요
    notes:
    - 게시 종료 7일 전부터 버튼이 보여요
    - 게시 기간이 끝난 글은 수정·연장이 안 되고 삭제만 할 수 있어요
    faq_keywords:
    - 게시 연장
    - 기간 연장
    - 게시 기간
    - 30일 더
  - id: 23-6
    task: 실종 글 수정·삭제·좋아요·신고·공유
    steps:
    - 내 글은 제목 아래 [수정] 또는 [삭제]를 눌러요(삭제는 확인 창에서 [삭제하기])
    - 글 아래 하트 [좋아요], [공유하기], [신고]로 좋아요·공유·신고를 해요
    notes:
    - 삭제하면 글과 제보 댓글이 되돌릴 수 없어요
    - 찾으셨다면 삭제 대신 '찾았어요'를 누르라고 안내해요
    faq_keywords:
    - 실종 글 수정
    - 실종 글 삭제
    - 실종 신고
- num: 24
  scr_id: SCR-CMU-003-01
  name: 펫뉴스
  param: null
  routable: true
  path: /community/news
  login_required: true
  summary: 반려생활에 도움이 되는 소식을 언론사 기사와 냥멍케어 소식으로 모아 보여 줘요. 읽기만 할 수 있어요.
  entry:
    pc:
    - 위쪽 메뉴 [커뮤니티] > [펫뉴스]
    mobile:
    - 헤더의 [전체 메뉴] > 커뮤니티 > 펫뉴스
    other:
    - 커뮤니티 다른 화면 왼쪽 메뉴의 [펫뉴스]
  status: 정상
  not_ready: []
  tasks:
  - id: 24-1
    task: 펫뉴스 보기
    steps:
    - 위쪽 카테고리에서 [전체] / [건강] / [생활] / [정책] / [여행] 중 하나를 골라요
    - 보고 싶은 기사를 눌러요
    - 상세에서 기사 요약을 읽어요
    notes:
    - 한 쪽에 10개씩 보여요
    - 뉴스는 읽기 전용이라 글쓰기·댓글·좋아요가 없어요
    faq_keywords:
    - 뉴스
    - 펫뉴스
    - 소식
    - 기사 보기
  - id: 24-2
    task: 뉴스 검색하기
    steps:
    - 검색칸 "제목 또는 내용 검색"에 단어를 입력해요
    - Enter를 누르거나 검색해요
    notes:
    - 결과가 없으면 "해당하는 뉴스가 없어요"와 [전체 뉴스 보기] 버튼이 나와요
    faq_keywords:
    - 뉴스 검색
    - 기사 검색
  - id: 24-3
    task: 기사 원문 보기와 공유
    steps:
    - 기사 상세에서 [원문 기사 보기]를 누르면 언론사 기사가 새 창으로 열려요
    - 아래쪽 [공유하기]에서 [링크 복사]를 눌러 주소를 복사해요
    notes:
    - 냥멍케어가 직접 올린 소식에는 원문 보기 버튼이 없어요
    faq_keywords:
    - 원문
    - 기사 원문
    - 뉴스 공유
- num: 25
  scr_id: SCR-CMU-004
  name: 우리동네 펫돌봄
  param: null
  routable: true
  path: /community/petcare
  login_required: true
  summary: 산책이나 돌봄을 도와줄 사람을 동네에서 구하는 게시판이에요. 돌봄 요청 글을 올리고 채팅으로 이야기해요.
  entry:
    pc:
    - 위쪽 메뉴 [커뮤니티] > [우리동네 펫돌봄]
    mobile:
    - 헤더의 [전체 메뉴] > 커뮤니티 > 우리동네 펫돌봄
    other:
    - 커뮤니티 다른 화면 왼쪽 메뉴의 [우리동네 펫돌봄]
    - 돌봄 글 상세의 [목록으로]
  status: 정상
  not_ready: []
  tasks:
  - id: 25-1
    task: 돌봄 요청 글 둘러보기와 찾기
    steps:
    - 위쪽 탭에서 [전체] / [모집중]을 골라요
    - '[상세 필터]를 열어 지역(전북 시·군·구와 읍·면·동), 돌봄 날짜, 반려동물, 반려견 크기를 골라요'
    - 보고 싶은 글을 누르면 상세로 가요
    notes:
    - 한 쪽에 10개씩 보여요
    - 반려견 크기는 반려동물에서 강아지를 골랐을 때 고를 수 있어요(고양이를 고르면 크기 조건이 사라져요)
    - 전북 지역만 고를 수 있어요
    - '[내 글만 보기]와 [필터 초기화]를 쓸 수 있어요'
    - 이 화면에는 글 검색칸이 없어요
    faq_keywords:
    - 펫돌봄
    - 돌봄
    - 펫시터
    - 산책 도우미
    - 맡아주실 분
    - 돌봄 글 찾기
  - id: 25-2
    task: 돌봄 요청 글쓰기
    steps:
    - 목록 아래쪽 [돌봄 요청 등록하기]를 눌러요
    - 반려동물 종류(강아지·고양이, 둘 다 가능)와 품종을 골라요. 강아지는 몸무게(소형견·중형견·대형견)도 골라요
    - 돌봄 형태(방문돌봄·위탁돌봄·산책·놀이·훈련·그 외)를 하나 이상 골라요
    - 돌봄 기간·시간을 고르거나 "일정은 채팅으로 협의할게요"를 체크해요
    - 비용 기준(시급 / 건당)을 고르고 금액을 입력해요
    - 제목과 상세 설명을 쓰고, 사진을 올려요(선택)
    - '[돌봄 장소 찾기]에서 장소를 고르고, 이용수칙 동의에 체크한 뒤 [등록]을 눌러요'
    notes:
    - 제목은 50자, 상세 설명은 2,000자까지예요
    - 시급은 2026년 최저 시급 10,320원 이상이어야 해요
    - 시간은 30분 단위로 고르고, 종료가 시작보다 뒤여야 해요
    - 글에는 동네까지만 보이고, 자세한 주소는 채팅에서 따로 알려 주면 돼요
    - 장소는 전북 지역만 고를 수 있어요
    - 사진은 최대 10장, JPG·PNG·WEBP, 한 장에 10MB까지예요
    faq_keywords:
    - 돌봄 요청 등록
    - 펫시터 구하기
    - 산책 맡기기
    - 펫돌봄 글쓰기
    - 돌봄 글 올리기
  - id: 25-3
    task: 돌봄 글에서 채팅하기
    steps:
    - 보고 싶은 돌봄 글 상세로 가요
    - 모집중이면 오른쪽 상자의 [채팅하기]를 눌러요
    - 열린 채팅 창에서 글쓴이에게 문의하고 일정을 이야기해요
    notes:
    - 모집이 끝난 글은 "모집이 끝났어요"로 바뀌어 눌러도 채팅을 시작할 수 없어요
    - 내가 쓴 글에는 [채팅하기] 대신 "지금 n명과 채팅 중"과 [채팅 목록 보기]가 보여요
    - 채팅 창이 안 열리면 브라우저에서 팝업을 허용해 달라는 안내가 나와요
    - 헤더의 채팅 아이콘으로도 채팅을 열 수 있어요
    faq_keywords:
    - 채팅하기
    - 펫돌봄 채팅
    - 돌봄 문의
    - 돌보미에게 연락
  - id: 25-4
    task: 내 돌봄 글에서 지원자 확인·수정·삭제
    steps:
    - 내 글 상세 오른쪽 상자의 [채팅 목록 보기]를 눌러 이 글로 채팅한 사람들과 대화해요
    - 글 위쪽 [수정] 또는 [삭제]를 눌러요(삭제는 확인 창에서 [삭제하기])
    notes:
    - 모집 상태는 채팅에서 매칭이 끝나면 자동으로 매칭완료, 거래가 끝나면 거래완료로 바뀌어요
    - 삭제해도 이미 나눈 채팅 기록은 남아요
    - 글을 고쳐도 채팅 기록은 바뀌지 않아요
    faq_keywords:
    - 지원자 확인
    - 채팅 목록
    - 돌봄 글 수정
    - 돌봄 글 삭제
  - id: 25-5
    task: 돌봄 글 좋아요·공유·신고
    steps:
    - 상세 아래의 하트 [좋아요], [공유하기], [신고]를 눌러요
    notes:
    - 돌봄 글에는 공개 댓글이 없어요(문의는 채팅으로 해요)
    faq_keywords:
    - 돌봄 글 신고
    - 돌봄 글 좋아요
