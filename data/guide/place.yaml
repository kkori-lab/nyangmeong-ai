  entry:
    pc:
    - 상단 메뉴 [플레이스]를 누르면 병원 화면으로 열려요
    mobile:
    - 헤더 [전체 메뉴] > 플레이스 아래 항목
    other:
    - 주소에 종류가 없거나 알 수 없는 종류이면 병원으로 열려요
  status: 정상
  not_ready: []
  tasks:
  - id: 3-1
    task: 플레이스 열고 원하는 종류로 가기
    steps:
    - 상단 메뉴 [플레이스]를 눌러요(마우스를 올리면 병원·미용·용품·동반·호텔이 나와요)
    - 화면이 열리면 왼쪽(모바일은 위쪽)의 종류 버튼에서 원하는 곳을 눌러요
    notes:
    - 처음에는 병원이 선택돼 있어요
    - 검색·정렬·즐겨찾기 사용법은 병원 화면과 같아요
    faq_keywords:
    - 플레이스 가기
    - 플레이스 열기
    - 장소 찾기
  - id: 3-2
    task: 가까운 곳 찾기
    steps:
    - 검색창에 "가까운 곳"을 입력하고 Enter를 눌러요
    - 또는 정렬을 [거리순]으로 두고 목록의 위쪽 장소부터 봐요
    notes:
    - 거리 기준은 지도 가운데예요. 내 위치가 아니에요
    - 위치 권한은 묻지 않아요
    faq_keywords:
    - 근처
    - 가까운 병원
    - 내 주변
