# 서비스 안내서 — 플레이스 (AI 매니저 사용법 안내, FN-AIM-002-02)
# 청크 = task 하나. id는 바꾸지 않는다(평가 정답표 tests/chat/data/guide_labels.json이 id로 가리킴)
# num·name·scr_id·param은 data/routing.yaml과 같다. 사람용 메모는 docs/guide-review.md
version: draft-0.1
updated: '2026-11-04'
screens:
- num: 2
  scr_id: SCR-HOS-001
  name: 플레이스 병원 화면
  param: ?cat=hospital
  routable: true
  path: /places?category=hospital
  login_required: false
  summary: 전주 지역의 동물병원·미용·용품·동반 장소·호텔을 지도와 목록으로 찾아보는 곳이에요. 병원 화면이 처음 열리는 기본 화면이에요.
  entry:
    pc:
    - 상단 메뉴 [플레이스] 또는 [플레이스] > [병원]
    mobile:
    - 헤더 [전체 메뉴] > 플레이스 > [병원]
    other:
    - 플레이스 다른 종류 화면에서 왼쪽(모바일은 위쪽)의 [병원] 버튼
    - AI 매니저에게 "병원 찾아줘"라고 말했을 때 안내되는 화면
  status: 정상
  not_ready: []
  tasks:
  - id: 2-1
    task: 장소 종류 바꾸기
    steps:
    - PC는 왼쪽 세로 버튼, 모바일은 지도 위쪽 가로 버튼에서 [병원] [미용] [용품] [동반] [호텔] 중 하나를 눌러요
    - 고른 종류의 장소가 목록과 지도에 새로 나타나요
    notes:
    - 종류를 바꾸면 검색어와 지도 위치가 처음 상태(전주시 전체)로 돌아가요
    - 검색창에는 종류 이름(동물병원·미용·용품·동반장소·호텔)이 처음 입력돼 있어요
    - 지금 보고 있는 종류는 색이 진하게 표시돼요
    - '[전체] 버튼은 없어요'
    faq_keywords:
    - 카테고리 바꾸기
    - 병원 미용 호텔 전환
    - 장소 종류
    - 탭 바꾸기
  - id: 2-2
    task: 지역·이름·키워드로 검색하기
    steps:
    - '''지역, 장소 이름, 키워드로 검색'' 칸에 찾을 말을 입력해요'
    - 키보드 Enter를 눌러요
    - 검색 결과가 목록과 지도 핀으로 바뀌어요
    notes:
    - 검색 버튼이 따로 없어요. Enter로 검색해요
    - 빈 칸으로는 검색되지 않아요
    - PC에서는 검색창 아래 '추천' 단어(24시 동물병원·야간진료·가까운 곳)를 누르면 바로 검색돼요
    - 결과가 없으면 "이 지도 영역에 검색 결과가 없어요. 지도를 옮기거나 검색어를 바꿔 보세요"가 보여요
    - 목록 끝까지 내리면 결과를 더 불러오고 최대 3쪽(45곳)까지 보여요
    - 거리는 마지막으로 검색한 시점의 지도 가운데 기준이에요
    faq_keywords:
    - 병원 검색
    - 장소 검색
    - 이름으로 찾기
    - 지역 검색
    - 24시 병원
    - 야간진료
  - id: 2-3
    task: 지도를 옮긴 곳에서 다시 검색하기
    steps:
    - 지도를 끌어서 옮기거나 확대·축소해요
    - 지도 위에 나타나는 [이 지도 영역에서 다시 검색]을 눌러요
    - 지금 보이는 지도 범위 기준으로 목록과 핀이 바뀌어요
    notes:
    - 지도만 옮겨서는 목록이 바뀌지 않아요. 버튼을 눌러야 바뀌어요
    - 검색어·종류·정렬은 그대로 유지돼요
    - 처음 화면은 전주시 전체이고 위치 권한은 묻지 않아요
    faq_keywords:
    - 이 지역에서 재검색
    - 지도 이동 검색
    - 다른 동네 찾기
    - 근처 병원
  - id: 2-4
    task: 정렬 바꾸기
    steps:
    - 목록 위쪽 오른쪽의 정렬 선택 칸을 눌러요
    - '[거리순] [추천순] [이름순] 중에서 골라요'
    notes:
    - 처음에는 거리순이에요
    - 정렬은 아래 검색 결과 목록에 적용돼요
    faq_keywords:
    - 정렬
    - 거리순
    - 추천순
    - 이름순
    - 가까운 순
  - id: 2-5
    task: 즐겨찾기 저장·해제하기
    steps:
    - 장소 카드 오른쪽 위의 별 버튼을 눌러요
    - 저장하면 목록 맨 위 '내 즐겨찾기'에 고정돼요
    - 같은 별을 다시 누르면 해제돼요
    notes:
    - 즐겨찾기는 종류(병원·미용 등)별로 따로 모여요
    - 저장한 곳이 하나도 없으면 '내 즐겨찾기' 영역 자체가 보이지 않아요
    - 지도를 옮겨 재검색했을 때 지도 밖에 있는 즐겨찾기는 '현재 지도 밖' 표시가 붙어요
    - 별을 눌러도 카카오맵 상세 화면은 열리지 않아요
    - 로그인한 회원만 쓸 수 있어요
    faq_keywords:
    - 즐겨찾기
    - 별 표시
    - 병원 저장
    - 북마크
    - 즐겨찾기 해제
  - id: 2-6
    task: 병원 정보 보기
    steps:
    - 목록에서 병원 카드를 눌러요
    - 카카오맵의 업체 상세 화면이 새 탭으로 열려요
    - 지도에서는 핀을 누르면 요약 카드가 떠요
    notes:
    - 카드에는 병원 이름·종류·거리·전화번호·주소가 보여요
    - 영업시간과 진료중 표시는 카드에 나오지 않아요. 카카오맵 상세에서 확인해요
    - 핀을 누르면 목록에서도 그 병원이 강조돼요
    faq_keywords:
    - 병원 정보
    - 전화번호
    - 주소
    - 영업시간
    - 병원 상세
    - 길찾기
  - id: 2-7
    task: 지도와 목록 화면 조절하기
    steps:
    - 지도 오른쪽의 [+] [−] 버튼으로 확대·축소하고 [처음 위치로]로 되돌려요
    - PC는 지도 왼쪽의 화살표 버튼으로 목록을 접거나 펴요
    - PC는 지도 위 오른쪽의 [일반 지도] [스카이뷰]로 지도 모양을 바꿔요
    - 모바일은 목록 위쪽 막대를 올리거나 내려 목록을 키우거나 지도를 크게 봐요
    faq_keywords:
    - 지도 확대
    - 스카이뷰
    - 목록 접기
    - 지도 크게 보기
- num: 3
  scr_id: SCR-HOS-001
  name: 플레이스
  param: null
  routable: true
  path: /places
  login_required: false
