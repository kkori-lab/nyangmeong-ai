- num: 21
  scr_id: SCR-HOS-002
  name: 동물병원 요약 카드
  param: null
  routable: false
  path: /places
  login_required: false
  summary: 지도에서 핀을 눌렀을 때 지도 위에 뜨는 작은 요약 카드예요. 이름·전화·주소를 보고 상세보기나 길찾기로 이어져요.
  entry:
    pc:
    - 플레이스 지도에서 장소 핀을 누르면 지도 아래쪽에 떠요
    mobile:
    - 플레이스 지도에서 장소 핀을 누르면 목록 시트 위에 떠요
    other:
    - 별도 주소 없이 플레이스 화면 안에서만 떠요
  status: 정상
  not_ready: []
  tasks:
  - id: 21-1
    task: 핀으로 장소 요약 보기
    steps:
    - 지도에서 장소 핀을 눌러요
    - 요약 카드에서 종류·거리·이름·전화번호·주소를 확인해요
    notes:
    - 목록에서도 같은 장소가 강조돼요
    - 전화번호가 없는 장소는 전화 줄이 안 보여요
    faq_keywords:
    - 핀 눌렀을 때
    - 병원 요약
    - 지도에서 병원 정보
  - id: 21-2
    task: 상세보기·길찾기 열기
    steps:
    - 요약 카드의 [상세보기]를 누르면 카카오맵 업체 상세가 새 탭으로 열려요
    - '[길찾기]를 누르면 카카오맵 길찾기가 새 탭으로 열려요'
    notes:
    - 이름을 눌러도 상세 화면이 열려요
    faq_keywords:
    - 상세보기
    - 길찾기
    - 카카오맵 열기
  - id: 21-3
    task: 요약 카드 닫기
