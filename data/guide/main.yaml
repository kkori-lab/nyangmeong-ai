# 서비스 안내서 — 메인 (AI 매니저 사용법 안내, FN-AIM-002-02)
# 청크 = task 하나. id는 바꾸지 않는다(평가 정답표 tests/chat/data/guide_labels.json이 id로 가리킴)
# num·name·scr_id·param은 data/routing.yaml과 같다. 사람용 메모는 docs/guide-review.md
version: draft-0.1
updated: '2026-11-04'
screens:
- num: 8
  scr_id: SCR-MAN-001
  name: 메인
  param: null
  routable: true
  path: /main
  login_required: true
  summary: 로그인하면 처음 보이는 화면이에요. AI 매니저에게 바로 물어보는 질문창과 우리 아이의 건강 요약, 오늘의 케어미션이 한 화면에 모여 있어요.
  entry:
    pc:
    - 헤더 왼쪽 로고
    mobile:
    - 헤더 왼쪽 로고
    other:
    - AI 매니저가 안내하는 "메인" 이동
  status: 일부 준비 중
  not_ready:
  - '건강 요약·체중·식사량·음수량·산책·혈액검사 카드, AI 건강분석 리포트, 케어미션: 아직 예시 값이에요. 실제 기록 연결은 곧 제공돼요'
  - '위젯 카드 순서 바꾸기: 곧 제공돼요'
  - 'AI 질문창이 메인에서 바로 대화창으로 커지는 기능: 곧 제공돼요. 지금은 새 창이 열려요'
  tasks:
  - id: 8-1
    task: 메인에서 AI 매니저에게 물어보기
    steps:
    - 가운데 질문창에 궁금한 것을 입력해요
    - '[AI 매니저에게 보내기](화살표 버튼)를 누르거나 Enter를 눌러요'
    - 새 창이 열리고 입력한 질문으로 대화가 시작돼요
    notes:
    - 빈 칸으로는 보낼 수 없어요
    - 질문창 아래 추천 질문(체중 변화 알려줘, 다음 접종 언제야?, 근처 동물병원 찾아줘, 미용실 추천해줘)을 누르면 바로 그 질문으로 대화가 열려요
    - 팝업이 막혀 있으면 "팝업이 차단되어 AI 매니저를 열 수 없어요." 안내가 떠요
    - 메인에는 오른쪽 아래 떠 있는 AI 버튼이 없어요
    faq_keywords:
    - AI에게 질문
    - 메인 질문창
    - 추천 질문
    - AI 매니저 메인
  - id: 8-2
    task: 대시보드 보기
    steps:
    - 질문창 아래로 내려가면 반려동물 프로필과 최근 검진·검사 수치·현재 처방 요약이 보여요
    - 그 아래 '건강기록 통합대시보드'에서 AI 건강분석 리포트, 체중, 식사량, 음수량, 산책, 혈액검사(CREA) 카드를 확인해요
    - 맨 아래 [통합대시보드 전체 보기]를 누르면 종합 건강기록으로 가요
    notes:
    - 건강 요약·위젯·AI 리포트의 숫자와 문구는 아직 서버와 연결되지 않은 예시 값이에요. 실제 기록과 다를 수 있어요
    - 반려동물 이름·성별·품종 같은 프로필은 실제 등록 정보예요
    faq_keywords:
    - 대시보드
    - 건강 요약
    - 체중 그래프
    - 건강 한눈에
    - 통합대시보드
  - id: 8-3
    task: 반려동물 바꿔 보기
    steps:
    - 프로필 영역 위쪽 반려동물 이름 버튼(칩)에서 보고 싶은 아이를 눌러요
    - 프로필과 아래 카드들이 그 아이 기준으로 바뀌어요
    notes:
    - 반려동물이 2마리 이상일 때만 이름 버튼이 보여요
    - 처음에는 첫 번째 반려동물이 선택돼 있어요
    faq_keywords:
    - 반려동물 전환
    - 다른 아이 보기
    - 펫 선택
  - id: 8-4
    task: 오늘의 케어미션 확인하기
    steps:
    - 아래쪽 '데일리 케어미션'에서 식사·음수·산책·약 복용·배변·놀이 등 완료 여부를 확인해요
    - 오른쪽 위 [토탈 케어리스트]를 누르면 케어 캘린더의 케어 목록으로 가요
    notes:
    - 메인에서는 보기만 가능하고 완료 체크는 못 해요
    - 미션 내용은 아직 서버와 연결되지 않은 예시 값이에요
    faq_keywords:
    - 케어미션
    - 오늘 할 일
    - 토탈 케어리스트
    - 데일리 미션
  - id: 8-5
    task: 반려동물이 없을 때
    steps:
    - 화면에 "등록된 반려동물이 없어요"가 보이면 [반려동물 등록하기]를 눌러요
    - 마이페이지 반려동물 관리에서 등록해요
    faq_keywords:
    - 반려동물 등록 안 됨
    - 메인 비어 있어요
