# 서비스 안내서 — 메인 (AI 매니저 사용법 안내, FN-AIM-002-02)
# 청크 = task 하나. id는 바꾸지 않는다(평가 정답표 tests/chat/data/guide_labels.json이 id로 가리킴)
# num·name·scr_id·param은 data/routes.snapshot.json과 같다(매핑표와는 scr_id·param으로 이음). 사람용 메모는 docs/guide-review.md
version: draft-0.1
updated: '2026-11-13'
screens:
- num: 8
  scr_id: SCR-MAN-001
  name: 메인
  param: null
  routable: true
  path: /main
  login_required: true
  summary: 로그인하면 처음 보이는 화면이에요. 위에서부터 인사말, AI 매니저에게 바로 물어보는 검색창, 반려동물 바로가기가 있어요.
  entry:
    pc:
    - 헤더 왼쪽 로고
    mobile:
    - 헤더 왼쪽 로고
    other:
    - AI 매니저가 안내하는 "메인" 이동
  status: 정상
  tasks:
  - id: 8-1
    task: 메인에서 AI 매니저에게 물어보기
    steps:
    - 가운데 검색창에 궁금한 것을 입력해요
    - '[AI 매니저] 버튼(휴대폰에서는 화살표 버튼)을 누르거나 Enter를 눌러요'
    - 같은 창에서 AI 매니저 대화창이 열리고 입력한 질문으로 대화가 시작돼요
    notes:
    - 빈 칸으로 보내면 첫 질문 없이 대화창만 열려요
    - 검색창 왼쪽 [+](사진 첨부)로 사진 1장을 붙여 보낼 수 있어요. 글은 없어도 돼요. 대화창이 사진을 보고 캐릭터 만들기·영수증 분석 중 무엇을 할지 판단해요
    - '사진은 jpg·jpeg·png·webp, 1장 10MB 이하만 붙일 수 있어요'
    - 새 창이나 팝업으로 열리지 않아요
    - 메인에는 오른쪽 아래 떠 있는 AI 버튼이 없어요
    faq_keywords:
    - AI에게 질문
    - 메인 질문창
    - 메인 검색창
    - 사진 첨부
    - AI 매니저 메인
  - id: 8-2
    task: 반려동물 바로가기로 이동하기
    steps:
    - 검색창 아래 '반려동물 바로가기'에서 가고 싶은 칸(반려동물 얼굴과 메뉴 이름)을 눌러요
    - 그 반려동물로 고른 화면(종합 건강기록, 건강 일지, 케어 캘린더, 반려동물 정보 수정, 캐릭터 꾸미기 등)이 열려요
    notes:
    - 바로가기는 반려동물마다 따로 만들어요
    - PC는 한 줄에 6칸씩 최대 12개, 휴대폰은 앞의 5개와 [바로가기 편집]이 보여요
    faq_keywords:
    - 바로가기
    - 반려동물 바로가기
    - 메인 메뉴
  - id: 8-3
    task: 바로가기 추가·수정·삭제하기
    steps:
    - '[바로가기 편집]을 눌러 반려동물과 메뉴 종류를 골라 한 번에 더해요'
    - 바로가기 칸 오른쪽 위 ⋮를 눌러 [바로가기 수정](반려동물·종류 바꾸기)이나 [삭제]를 골라요
    notes:
    - 삭제는 확인 없이 바로 빠져요
    - 이미 넣은 종류는 다시 고를 수 없어요
    - 12개가 차면 [바로가기 편집] 칸이 보이지 않아요
    - PC에서는 ⋮가 마우스를 올렸을 때만 보여요
    faq_keywords:
    - 바로가기 편집
    - 바로가기 추가
    - 바로가기 삭제
    - 바로가기 수정
  - id: 8-4
    task: 바로가기 순서 바꾸기
    steps:
    - PC에서 바로가기 칸을 끌어 원하는 자리에 놓아요
    notes:
    - 순서는 지금 쓰는 브라우저에만 저장돼요. 다른 기기에서는 처음 순서로 보여요
    - 휴대폰 화면에서는 끌어서 옮길 수 없어요
    faq_keywords:
    - 바로가기 순서
    - 바로가기 옮기기
  - id: 8-5
    task: 반려동물이 없을 때
    steps:
    - 화면에 "등록된 반려동물이 없어요"가 보이면 [반려동물 등록하기]를 눌러요
    - 마이페이지 반려동물 관리에서 등록해요
    notes:
    - 반려동물을 등록하면 바로가기를 만들 수 있어요
    faq_keywords:
    - 반려동물 등록 안 됨
    - 메인 비어 있어요
