# 부록 B. 등록 판정 사전 (AI매니저 기능명세서 v0.9, FN-AIM-001-05 ①·FN-AIM-012-01)
# 등록 동사 + (날짜·시간·주기 표현)이 둘 다 있으면 등록 요청이다.
# 정규식은 공백을 뺀 문장에 대조한다. 운영 중 키워드를 추가하면 명세 개정내역에도 기록한다.
version: v0.9
# 어미 변형(잡아 줘·등록해 주세요·넣어 줄래 등) 포함
verbs:
  - "(잡아|등록해|넣어|추가해|예약해|만들어)(줘|주|줄)"
dates:
  - "오늘|내일|모레|어제"
  - "(이번|다음|지난)주[월화수목금토일]요일"
  # 요일만 쓴 표현. 화면설계서 SCR-AIM-012 ⑦ 예시("금요일에 병원 예약 잡아줘")가 등록 요청이다
  - "[월화수목금토일]요일"
  - "다음달\\d+일"
  - "\\d+일후"
  - "\\d+월\\d+일"
  - "\\d+일"
  - "\\d{1,2}/\\d{1,2}"
  - "\\d{4}-\\d{2}-\\d{2}"
times:
  - "(오전|오후)\\d+시"
  - "\\d+시(\\d+분|반)?"
  - "\\d{1,2}:\\d{2}"
cycles:
  - "매일|날마다|하루에한번"
  - "매주|일주일마다|\\d+주마다|격주"
  - "매달|한달마다|매년|\\d+년마다"
  - "\\d+일마다"

# 규칙 해석(FN-AIM-012-02). 공통코드는 백엔드 db/20261029_insert_base_data_v0.10.sql 기준
# 일정 종류 키워드(HLTG19). 위 행부터 대조한다. name은 그 외 종류의 일정명으로 쓴다
schedule_types:
  - code: HLTC0057 # 병원
    keywords: ["동물병원", "병원", "진료", "검진", "예방접종", "접종", "백신", "진찰"]
  - code: HLTC0058 # 미용·목욕
    keywords: ["미용", "목욕", "털깎기", "털정리", "그루밍"]
  - code: HLTC0059 # 케어·투약
    keywords: ["투약", "영양제", "구충", "심장사상충"]
# 검진유형 키워드(HLTG01). 위 행부터 대조한다
checkup_types:
  - code: HLTC0001
    keywords: ["정기검진", "건강검진", "검진"]
  - code: HLTC0002
    keywords: ["예방접종", "접종", "백신"]
  - code: HLTC0003
    keywords: ["질병진료", "진료", "진찰"]
  - code: HLTC0004
    keywords: ["검사"]
# 코드 → 화면 표시 이름(카드 요약·되물음 문구)
code_names:
  HLTC0057: 병원
  HLTC0058: 미용·목욕
  HLTC0059: 케어·투약
  HLTC0060: 기타
  HLTC0001: 정기검진
  HLTC0002: 예방접종
  HLTC0003: 질병진료
  HLTC0004: 검사
  HLTC0005: 기타 진료
  HLTC0036: 일상관리
  HLTC0037: 정기관리
  HLTC0038: 1주
  HLTC0039: 2주
  HLTC0040: 한달
  HLTC0041: 1년
  HLTC0042: 직접입력
