# 부록 B. 등록 판정 사전 (AI매니저 기능명세서 v0.9, FN-AIM-001-05 ①·FN-AIM-012-01)
# 등록 동사 + (날짜·시간·주기 표현)이 둘 다 있으면 등록 요청이다.
# 정규식은 공백을 뺀 문장에 대조한다. 운영 중 키워드를 추가하면 명세 개정내역에도 기록한다.
version: v0.9
# 어미 변형(잡아 줘·등록해 주세요·넣어 줄래 등) 포함
verbs:
  - "(잡아|등록해|넣어|추가해|예약해|만들어)(줘|주|줄)"
dates:
  - "오늘|내일|모레|어제"
  - "(이번|다음|지난)주[월화수목금토일]요일"
  - "다음달\\d+일"
  - "\\d+일후"
  - "\\d+월\\d+일"
  - "\\d+일"
  - "\\d{1,2}/\\d{1,2}"
  - "\\d{4}-\\d{2}-\\d{2}"
times:
  - "(오전|오후)\\d+시"
  - "\\d+시(\\d+분|반)?"
  - "\\d{1,2}:\\d{2}"
cycles:
  - "매일|날마다|하루에한번"
  - "매주|일주일마다|\\d+주마다|격주"
  - "매달|한달마다|매년|\\d+년마다"
  - "\\d+일마다"
