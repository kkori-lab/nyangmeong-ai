# 명세가 바뀌면 이 파일만 고친다. 키워드는 공백을 빼고 대조한다(최장 일치, 같은 길이면 위쪽 행).
# num: 부록 A의 No(YAML에서 `no`는 false로 읽혀 이름을 바꿈). routable: false 는 라우팅 대상이 아닌 행(종속 화면·제외·보류). 키워드를 두지 않는다.
