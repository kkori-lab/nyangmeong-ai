    쓸 때: 어떤 약관이 있는지, 약관 시행일을 묻는 말.
      예) "이용약관 뭐 있어?", "개인정보 처리방침 언제부터야?"
    쓰지 않을 때: 한 약관의 본문은 get_terms. 공지사항은 list_notices.
    말하는 법: 받은 약관 제목·날짜만 쓴다.

