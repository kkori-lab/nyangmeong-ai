      예) "방금 온 일정 알림 읽음으로 해 줘", "그 알림 읽은 걸로 해 줘"
    쓰지 않을 때: 알림 전부를 읽음으로 하는 말은 mark_all_notifications_read. 알림을 묻기만 하는 말은
      list_notifications.
    인자: inapp_noti_sn은 이 턴 list_notifications 결과의 inappNotiSn만 쓴다. 결과가 없으면
      list_notifications를 먼저 부른다. 어느 것인지 하나로 정할 수 없으면 비운다(지어내지 않는다).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    inapp_noti_sn:
      java: inappNotiSn
      description: 읽음으로 할 알림 번호. 이 턴 list_notifications 결과의 inappNotiSn만, 모르면 비운다

mark_all_notifications_read:
  label: 알림 모두 읽음 처리
  description: |
    읽지 않은 알림을 모두 읽음으로 바꾸는 확인 카드를 대화창에 띄운다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 바꾸지 않는다.

    쓸 때: 알림을 전부 읽음으로 해 달라는 말.
      예) "알림 다 읽음 처리해 줘", "안 읽은 알림 전부 읽은 걸로 해 줘"
    쓰지 않을 때: 알림 하나만 읽음으로 하는 말은 mark_notification_read. 알림을 끄는 말은 search_guide.
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.

get_chat_unread_count:
  label: 읽지 않은 채팅 수
  screen: SCR-COM-009
  description: |
    채팅(펫돌봄 1:1 채팅)의 읽지 않은 메시지 수를 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 안 읽은 채팅·메시지가 있는지 묻는 말.
      예) "안 읽은 채팅 있어?", "돌봄 채팅 새 메시지 왔어?"
    쓰지 않을 때: 앱 알림은 get_unread_notification_count. 채팅방으로 가자는 말은 navigate.
    말하는 법: 받은 수만 쓴다. 채팅 내용은 대화창에서 볼 수 없다고 말한다.

get_today_story:
  label: 오늘의 커뮤니티 이야기
  screen: SCR-CMU-001-01
  description: |
    AI가 하루 단위로 정리한 커뮤니티 이야기(오늘의 해설)를 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 오늘·어제 커뮤니티에서 무슨 이야기가 많았는지 묻는 말.
      예) "오늘 커뮤니티 무슨 얘기 많아?", "어제 펫이야기 요약해 줘"
    쓰지 않을 때: 글 목록·검색은 list_posts. 인기 사진은 get_popular_photo. 펫뉴스는 list_news.
    인자: 날짜를 말했으면 cmtry_crtr_ymd(시스템의 오늘 날짜 기준으로 계산). 말하지 않으면 비운다.
    말하는 법: 받은 해설만 짧게 옮긴다.
  params:
    cmtry_crtr_ymd:
      java: cmtryCrtrYmd
      description: 정리 기준 날짜 YYYY-MM-DD. 말하지 않았으면 비운다

get_news:
  label: 펫뉴스 상세
  screen: SCR-CMU-003-01
  description: |
    펫뉴스 하나의 내용을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 특정 펫뉴스의 내용을 묻는 말.
      예) "그 사료 뉴스 내용 알려 줘", "첫 번째 뉴스 자세히 말해 줘"
    쓰지 않을 때: 뉴스 목록은 list_news.
    인자: news_sn은 이 턴 list_news 결과의 newsSn만 쓴다. 결과가 없으면 list_news를 먼저 부른다.
    말하는 법: 받은 기사 내용만 짧게 요약한다. 지어내지 않는다.
  params:
    news_sn:
      java: newsSn
      description: 뉴스 번호. 이 턴 list_news 결과의 newsSn만, 모르면 비운다

get_lost_report:
  label: 실종·목격 신고 상세
  screen: SCR-CMU-002
  description: |
    실종·목격 신고 하나의 내용(동물·장소·날짜·특징)을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 특정 실종·목격 신고를 자세히 묻는 말.
      예) "그 실종 신고 어디서 잃어버린 거야?", "내가 올린 실종 신고 내용 보여 줘"
    쓰지 않을 때: 신고 목록은 list_lost_reports. 신고를 올리는 말은 navigate.
    인자: lost_tpof_sn은 이 턴 list_lost_reports 결과의 lostTpofSn만 쓴다. 결과가 없으면
      list_lost_reports를 먼저 부른다.
    말하는 법: 받은 내용만 쓴다. 연락처는 말하지 않는다.
  params:
    lost_tpof_sn:
      java: lostTpofSn
      description: 신고 번호. 이 턴 list_lost_reports 결과의 lostTpofSn만, 모르면 비운다

get_care_recruitment:
  label: 펫돌봄 모집 상세
  screen: SCR-CMU-004
  description: |
    펫돌봄 모집 글 하나의 내용(기간·동물·금액·조건·모집 상태)을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 특정 펫돌봄 모집을 자세히 묻는 말.
      예) "그 주말 돌봄 모집 금액 얼마야?", "내가 올린 모집 조건 뭐였지?"
    쓰지 않을 때: 모집 목록은 list_care_recruitments. 매칭된 돌봄의 진행은 get_care_match.
      최저임금은 get_minimum_wage.
    인자: pet_prtc_rcrt_sn은 이 턴 list_care_recruitments 결과의 petPrtcRcrtSn만 쓴다. 결과가 없으면
      list_care_recruitments를 먼저 부른다.
    말하는 법: 받은 내용만 쓴다. 작성자는 닉네임으로만 쓰고 연락처는 말하지 않는다.
  params:
    pet_prtc_rcrt_sn:
      java: petPrtcRcrtSn
      description: 모집 번호. 이 턴 list_care_recruitments 결과의 petPrtcRcrtSn만, 모르면 비운다

get_care_match:
  label: 펫돌봄 매칭
  screen: SCR-CMU-004
  description: |
    펫돌봄 매칭 하나의 진행(조건·완료 요청 회차·돌봄비 수령 상태)을 읽어 와 답한다. 아무것도 저장하지 않는다.
    매칭 참여자만 볼 수 있다.

    쓸 때: 매칭된 돌봄이 어디까지 진행됐는지, 완료 요청·수령 상태를 묻는 말.
      예) "돌봄 매칭 지금 어떻게 됐어?", "돌봄비 받았다고 표시됐어?"
    쓰지 않을 때: 모집 글 자체는 get_care_recruitment·list_care_recruitments.
    인자: pet_prtc_mtch_sn은 이 턴 READ 결과의 petPrtcMtchSn만 쓴다. 모르면 비운다(지어내지 않는다).
    말하는 법: 받은 상태만 쓴다.
  params:
    pet_prtc_mtch_sn:
      java: petPrtcMtchSn
      description: 매칭 번호. 이 턴 READ 결과의 petPrtcMtchSn만, 모르면 비운다

get_minimum_wage:
  label: 최저임금
  screen: SCR-CMU-004
  description: |
    펫돌봄 모집 금액 기준으로 쓰는 올해 최저임금(시급)을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 최저임금, 돌봄 시급 기준을 묻는 말.
      예) "올해 최저시급 얼마야?", "돌봄 모집 금액 최소 얼마부터야?"
    쓰지 않을 때: 모집 글의 금액은 get_care_recruitment.
    말하는 법: 받은 금액만 쓴다.

list_breeds:
  label: 품종 목록
  screen: SCR-MYP-002
  description: |
    강아지·고양이 품종 목록을 읽어 와 답한다. 아무것도 저장하지 않는다.
    반려동물 등록 카드(draft_pet)의 품종 번호(vrtySn)를 얻을 때도 부른다.

    쓸 때: 앱에서 고를 수 있는 품종을 묻는 말, 반려동물을 등록하는데 품종을 말한 말(먼저 부른다).
      예) "고양이 품종 뭐 있어?", "말티푸도 목록에 있어?"
    쓰지 않을 때: 품종의 성격·건강 지식은 도구 없이 바로 답한다.
    인자: pet_se_cd는 강아지·고양이 중 말한 것.
    말하는 법: 받은 품종 이름만 쓴다.
  params:
    pet_se_cd:
      java: petSeCd
      description: 동물 종류

get_pet_limit:
  label: 반려동물 등록 한도
  screen: SCR-MYP-002
  description: |
    반려동물을 몇 마리까지 등록할 수 있는지, 지금 몇 마리인지 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 반려동물을 더 등록할 수 있는지, 등록 한도를 묻는 말.
      예) "반려동물 몇 마리까지 등록돼?", "한 마리 더 등록할 수 있어?"
    쓰지 않을 때: 등록된 반려동물 목록은 list_pets.
    말하는 법: 받은 수만 쓴다.

list_main_shortcuts:
  label: 메인 바로가기
  screen: SCR-MAN-001
  description: |
    메인 화면에 둔 바로가기 목록을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 메인 화면 바로가기에 무엇이 있는지 묻는 말.
      예) "메인 바로가기에 뭐 넣어 놨지?"
    쓰지 않을 때: 바로가기를 바꾸는 방법은 search_guide. 어떤 화면으로 가자는 말은 navigate.
    말하는 법: 받은 바로가기 이름만 쓴다.

list_point_ledger_months:
  label: 포인트 내역이 있는 달
  screen: SCR-MYP-020
  description: |
    포인트가 들어오거나 나간 기록이 있는 달 목록을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 포인트 내역이 언제부터 있는지, 어느 달에 포인트를 썼는지 묻는 말.
      예) "포인트 내역 몇 월부터 있어?", "포인트 쓴 달이 언제언제야?"
    쓰지 않을 때: 한 달의 자세한 내역은 list_point_ledgers. 잔액은 get_points.
      돈 지출이 있는 달은 list_expense_months.
    말하는 법: 받은 달만 쓴다.

get_caregiver_invitation:
  label: 받은 공동양육 초대
  screen: SCR-MYP-004
  description: |
    받은 공동양육 초대 하나(보낸 사람·반려동물·상태·만료)를 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 받은 초대가 누구에게서 왔는지, 어떤 반려동물인지, 언제까지인지 묻는 말.
      예) "받은 공동양육 초대 누가 보낸 거야?", "그 초대 어떤 아이야?"
    쓰지 않을 때: 내가 보낸 초대는 list_sent_caregiver_invitations. 이미 같이 돌보는 사람은 list_caregivers.
    인자: jnt_brup_invtn_sn은 이 턴 READ 결과의 jntBrupInvtnSn만 쓴다. 모르면 비운다(지어내지 않는다).
    말하는 법: 받은 내용만 쓴다. 이메일은 가려진 그대로 쓴다.
  params:
    jnt_brup_invtn_sn:
      java: jntBrupInvtnSn
      description: 초대 번호. 이 턴 READ 결과의 jntBrupInvtnSn만, 모르면 비운다

list_inquiries:
  label: 1:1 문의
  screen: SCR-CSC-002-01
  description: |
    내가 남긴 1:1 문의 목록(제목·날짜·답변 상태)을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 문의에 답이 왔는지, 내가 남긴 문의를 묻는 말.
      예) "내 문의 답변 왔어?", "지난번에 한 문의 뭐였지?"
    쓰지 않을 때: 문의 하나의 답변 내용은 get_inquiry. 자주 묻는 질문·사용법은 search_guide.
      공지사항은 list_notices.
    인자: 답변 온 것만·접수된 것만 물으면 inqry_prcs_stts_cd. 말하지 않은 칸은 비운다.
    말하는 법: 받은 문의만 쓴다.
  params:
    inqry_prcs_stts_cd:
      java: inqryPrcsSttsCd
      description: 처리 상태
    page:
      java: page
      description: 페이지 번호
    size:
      java: size
      description: 한 페이지 문의 수

get_inquiry:
  label: 1:1 문의 상세
  screen: SCR-CSC-002-01
  description: |
    1:1 문의 하나의 내용과 답변을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 특정 문의의 답변 내용을 묻는 말.
      예) "그 결제 문의 답변 뭐라고 왔어?"
    쓰지 않을 때: 문의 목록은 list_inquiries.
    인자: oto_inqry_sn은 이 턴 list_inquiries 결과의 otoInqrySn만 쓴다. 결과가 없으면 list_inquiries를
      먼저 부른다.
    말하는 법: 받은 답변만 짧게 옮긴다.
  params:
    oto_inqry_sn:
      java: otoInqrySn
      description: 문의 번호. 이 턴 list_inquiries 결과의 otoInqrySn만, 모르면 비운다

list_notices:
  label: 공지사항
  screen: SCR-CSC-001
  description: |
    운영자가 올린 공지사항 목록(제목·날짜)을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 공지사항·새 소식·점검 안내를 묻는 말.
      예) "공지사항 최근 거 알려 줘", "점검 공지 있어?"
    쓰지 않을 때: 내게 온 알림은 list_notifications. 공지 하나의 본문은 get_notice. 펫뉴스는 list_news.
    인자: 낱말을 말했으면 keyword, 최신 것만 물으면 latest_yn true. 말하지 않은 칸은 비운다.
    말하는 법: 받은 공지 제목·날짜만 쓴다.
  params:
    keyword:
      java: keyword
      description: 찾을 낱말
    latest_yn:
      java: latestYn
      description: 최신 공지만이면 true
    page:
      java: page
      description: 페이지 번호
    size:
      java: size
      description: 가져올 공지 수

get_notice:
  label: 공지사항 내용
  screen: SCR-CSC-001
  description: |
    공지사항 하나의 본문을 읽어 와 답한다. 아무것도 저장하지 않는다.

    쓸 때: 특정 공지의 내용을 묻는 말.
      예) "그 점검 공지 몇 시까지래?", "첫 번째 공지 내용 알려 줘"
    쓰지 않을 때: 공지 목록은 list_notices. 내게 온 알림은 list_notifications.
    인자: ntc_mttr_sn은 이 턴 list_notices 결과의 ntcMttrSn만 쓴다. 결과가 없으면 list_notices를 먼저 부른다.
    말하는 법: 받은 본문만 짧게 옮긴다.
  params:
    ntc_mttr_sn:
      java: ntcMttrSn
      description: 공지 번호. 이 턴 list_notices 결과의 ntcMttrSn만, 모르면 비운다

cancel_last_dose:
  label: 마지막 투약 취소
  target: 오늘 마지막 완료 기록
  hooks: [pet]
  target_fields: [careArtclNm]
  description: |
    케어 항목(약·영양제 등)의 오늘 마지막 완료 체크 하나를 되돌리는 확인 카드를 대화창에 띄운다.
    회원이 대화로 '삭제해 줘'라고 말하기 전에는 아무것도 지우지 않는다.

    쓸 때: 오늘 마지막으로 체크한 투약·케어를 잘못 눌렀으니 취소해 달라는 말.
      예) "오늘 마지막 투약 취소해 줘", "심장약 방금 체크한 거 취소해 줘"
    쓰지 않을 때: 날짜를 말한 지난 완료 기록 하나를 지우는 말은 cancel_care_completion.
      케어 항목 자체를 없애는 말은 delete_care_item.
    인자: care_artcl_sn은 이 턴 list_care_items 결과에서 todayCmptnCnt가 1 이상인 행의 careArtclSn만 쓴다.
      결과가 없으면 list_care_items를 먼저 부른다(항목 이름을 말했으면 care_artcl_nm). 투약이라고 했으면
      dayMdcnNmtm이 있는 행을 고른다. 그런 행이 하나가 아니면 비운다. 오늘 완료가 없으면 비운다(지어내지 않는다).
      반려동물은 고르지 않는다(서버가 정한다).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    care_artcl_sn:
      java: careArtclSn
      description: 완료를 되돌릴 케어 항목 번호. 이 턴 list_care_items 결과에서 todayCmptnCnt가 1 이상인 행의 careArtclSn만, 모르면 비운다

draft_checkup:
  label: 검진기록 등록
  hooks: [pet]
  description: |
    병원 검진기록 하나(날짜·병원·검진유형·진료 내용)의 확인 카드를 대화창에 띄운다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 저장하지 않는다.

    쓸 때: 병원에 다녀온 기록·검진·예방접종을 남겨 달라는 말.
      예) "어제 행복동물병원에서 예방접종했어 기록해 줘", "오늘 정기검진 다녀왔어 검진기록 남겨 줘"
    쓰지 않을 때: 앞으로 갈 병원 예약은 draft_schedule. 혈액 수치는 draft_inspection_values.
      처방받은 약은 draft_prescription. 혈액 수치가 아닌 기타 검사 결과는 draft_etc_inspection.
      이미 있는 검진기록을 고치는 말은 draft_checkup_update.
    인자: 말하지 않은 칸은 비운다(지어내지 않는다). 날짜는 시스템의 오늘 날짜 기준으로 계산한다.
      일정에서 온 검진이면 schdl_sn은 이 턴 list_my_care_schedules 결과의 schdlSn만, 모르면 비운다.
      반려동물은 고르지 않는다(서버가 정한다).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    ckup_ymd:
      java: ckupYmd
      description: 검진 날짜 YYYY-MM-DD
    hsptl_nm:
      java: hsptlNm
      description: 병원 이름
    ckup_type_cd:
      java: ckupTypeCd
      description: 검진유형
    ckup_cn:
      java: ckupCn
      description: 진료·검진 내용(말한 것만)
    ckup_memo_cn:
      java: ckupMemoCn
      description: 회원 메모(말한 것만)
    schdl_sn:
      java: schdlSn
      description: 이어진 일정 번호. 이 턴 list_my_care_schedules 결과의 schdlSn만, 모르면 비운다

draft_etc_inspection:
  label: 기타검사 등록
  hooks: [pet]
  description: |
    검진기록에 기타검사(엑스레이·초음파·소변 검사 등 수치가 아닌 검사) 결과 하나를 더하는 확인 카드를
    대화창에 띄운다. 회원이 대화로 확인 말을 하기 전에는 아무것도 저장하지 않는다.

    쓸 때: 검진 때 받은 엑스레이·초음파 등 검사 결과를 글로 남겨 달라는 말.
      예) "어제 검진에서 엑스레이 정상이래 기록해 줘", "초음파 결과 신장 약간 커짐 적어 줘"
    쓰지 않을 때: 혈액 수치(숫자)는 draft_inspection_values. 검진 자체(날짜·병원)는 draft_checkup.
      처방약은 draft_prescription. 이미 있는 기타검사를 고치는 말은 draft_etc_inspection_update.
    인자: ckup_rcd_sn은 이 턴 list_checkups 결과의 ckupRcdSn만 쓴다. 결과가 없으면 list_checkups를 먼저 부른다.
      말하지 않은 칸은 비운다. 반려동물은 고르지 않는다(서버가 정한다).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    ckup_rcd_sn:
      java: ckupRcdSn
      description: 붙일 검진기록 번호. 이 턴 list_checkups 결과의 ckupRcdSn만, 모르면 비운다
    insp_nm:
      java: inspNm
      description: 검사 이름(엑스레이·초음파 등)
    insp_rslt_cn:
      java: inspRsltCn
      description: 검사 결과(말한 그대로)
    memo_cn:
      java: memoCn
      description: 회원 메모(말한 것만)

draft_prescription:
  label: 처방약 등록
  hooks: [pet]
  description: |
    검진기록에 처방약 하나(약 이름·복용 기간·하루 횟수·상태)를 더하는 확인 카드를 대화창에 띄운다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 저장하지 않는다.

    쓸 때: 병원에서 받은 약을 기록해 달라는 말.
      예) "어제 검진에서 항생제 일주일치 받았어 하루 두 번 기록해 줘", "피부약 처방 등록해 줘"
    쓰지 않을 때: 약을 먹였다고 체크하는 말은 draft_care_completion. 매일 먹이는 영양제 케어 항목은
      draft_care_item. 처방약을 묻기만 하는 말은 list_prescriptions. 고치는 말은 draft_prescription_update.
      심장사상충·구충제처럼 주기적으로 반복하는 예방은 draft_repeat_prevention.
    인자: ckup_rcd_sn은 이 턴 list_checkups 결과의 ckupRcdSn만 쓴다. 결과가 없으면 list_checkups를 먼저 부른다.
      날짜는 시스템의 오늘 날짜 기준으로 계산한다("일주일치"면 끝 날짜 = 시작 + 6일). 상태를 말하지 않았으면
      복용중. 말하지 않은 칸은 비운다. 반려동물은 고르지 않는다(서버가 정한다).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    ckup_rcd_sn:
      java: ckupRcdSn
      description: 붙일 검진기록 번호. 이 턴 list_checkups 결과의 ckupRcdSn만, 모르면 비운다
    mdcn_nm:
      java: mdcnNm
      description: 약 이름
    mdcn_bgng_ymd:
      java: mdcnBgngYmd
      description: 복용 시작 날짜 YYYY-MM-DD
    mdcn_end_ymd:
      java: mdcnEndYmd
      description: 복용 끝 날짜 YYYY-MM-DD
    day_mdcn_nmtm:
      java: dayMdcnNmtm
      description: 하루 복용 횟수(숫자)
    prsc_stts_cd:
      java: prscSttsCd
      description: 복용 상태
    care_rflt_yn:
      java: careRfltYn
      description: 케어 캘린더에 복용 일정을 넣어 달라고 했으면 true, 말하지 않았으면 비운다

draft_repeat_prevention:
  label: 반복 예방 등록
  hooks: [pet]
  description: |
    검진기록에 반복 예방(심장사상충 예방·구충제) 하나와 주기를 더하는 확인 카드를 대화창에 띄운다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 저장하지 않는다.

    쓸 때: 심장사상충 약·구충제를 맞혔고 주기마다 반복한다고 기록해 달라는 말.
      예) "오늘 병원에서 심장사상충 예방했어 한 달마다 기록해 줘", "구충제 3개월마다로 등록해 줘"
    쓰지 않을 때: 그 밖의 처방약은 draft_prescription. 반복 예방을 묻기만 하는 말은 list_repeat_preventions.
      매일 하는 케어 항목은 draft_care_item.
    인자: ckup_rcd_sn은 이 턴 list_checkups 결과의 ckupRcdSn만 쓴다. 결과가 없으면 list_checkups를 먼저 부른다.
      목록에 없는 주기("3개월마다")는 rept_cycle_cd 직접입력과 cycle_drct_inpt_day_cnt 날 수(90).
      날짜는 시스템의 오늘 날짜 기준으로 계산한다. 반려동물은 고르지 않는다(서버가 정한다).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    ckup_rcd_sn:
      java: ckupRcdSn
      description: 붙일 검진기록 번호. 이 턴 list_checkups 결과의 ckupRcdSn만, 모르면 비운다
    rept_prvnt_artcl_cd:
      java: reptPrvntArtclCd
      description: 예방 종류
    rept_cycle_cd:
      java: reptCycleCd
      description: 반복 주기
    cycle_drct_inpt_day_cnt:
      java: cycleDrctInptDayCnt
      description: 주기가 직접입력일 때 날 수(숫자)
    bgng_ymd:
      java: bgngYmd
      description: 시작 날짜 YYYY-MM-DD. 말하지 않았으면 오늘

end_observation_item:
  label: 관찰 종료
  target: 관찰 항목
  hooks: [pet]
  description: |
    관찰 중인 항목 하나(피부 혹·눈 충혈 등)를 관찰 종료로 바꾸는 확인 카드를 대화창에 띄운다.
    기록은 지우지 않는다. 회원이 대화로 확인 말을 하기 전에는 아무것도 바꾸지 않는다.

    쓸 때: 다 나아서 더 관찰하지 않는다, 관찰을 끝내 달라는 말.
      예) "등에 혹 다 나았어 관찰 종료해 줘", "눈 충혈 관찰 이제 그만할게"
    쓰지 않을 때: 관찰 기록 한 회차를 지우는 말은 delete_observation_cycle. 새 관찰 기록을 더하는 말은
      draft_observation_cycle. 관찰 항목을 묻기만 하는 말은 list_observation_items.
    인자: obsrv_artcl_sn은 이 턴 list_observation_items 결과의 obsrvArtclSn만 쓴다. 결과가 없으면
      list_observation_items를 먼저 부른다. 어느 것인지 하나로 정할 수 없으면 비운다(지어내지 않는다).
      반려동물은 고르지 않는다(서버가 정한다).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    obsrv_artcl_sn:
      java: obsrvArtclSn
      description: 끝낼 관찰 항목 번호. 이 턴 list_observation_items 결과의 obsrvArtclSn만, 모르면 비운다

draft_pet:
  label: 반려동물 등록
  description: |
    새 반려동물 하나(이름·종류·품종·생일·성별·중성화·몸무게·털색)를 등록하는 확인 카드를 대화창에 띄운다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 저장하지 않는다.

    쓸 때: 새로 데려온 아이를 등록해 달라는 말.
      예) "새로 온 고양이 나비 등록해 줘, 코리안숏헤어 암컷 2024년 3월생 3.5kg", "강아지 한 마리 더 등록할래"
    쓰지 않을 때: 이미 등록한 아이의 정보를 바꾸는 말은 draft_pet_update. 몇 마리까지 되는지는 get_pet_limit.
    인자: 말하지 않은 칸은 비운다(지어내지 않는다). 품종은 이 턴 list_breeds 결과의 vrtySn만 쓰고,
      결과가 없으면 list_breeds를 먼저 부른다. 목록에 없는 품종이면 vrty_drct_inpt_nm에 말한 이름.
      털색이 목록에 없으면 colr_cd 직접 입력과 colr_drct_inpt_nm. 몸무게는 kg 숫자만.
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    pet_nm:
      java: petNm
      description: 이름
    pet_se_cd:
      java: petSeCd
      description: 동물 종류
    vrty_sn:
      java: vrtySn
      description: 품종 번호. 이 턴 list_breeds 결과의 vrtySn만, 모르면 비운다
    vrty_drct_inpt_nm:
      java: vrtyDrctInptNm
      description: 품종 목록에 없을 때만 말한 품종 이름
    pet_brdt:
      java: petBrdt
      description: 생일 YYYY-MM-DD(달까지만 말했으면 그 달 1일)
    pet_gndr_cd:
      java: petGndrCd
      description: 성별
    nutr_yn:
      java: nutrYn
      description: 중성화 여부
    pet_bdwg:
      java: petBdwg
      description: 몸무게(kg 숫자만)
    goal_bdwg:
      java: goalBdwg
      description: 목표 체중(kg 숫자만). 말하지 않았으면 비운다
    colr_cd:
      java: colrCd
      description: 털색
    colr_drct_inpt_nm:
      java: colrDrctInptNm
      description: 털색이 직접 입력일 때 말한 색 이름
    chip_no:
      java: chipNo
      description: 동물등록 인식칩 번호(숫자 12자리 또는 15자리). 말하지 않았으면 비운다
    chrc_cn:
      java: chrcCn
      description: 특징(말한 것만, 쉼표로 구분)
    algy_cn:
      java: algyCn
      description: 알레르기(말한 것만, 쉼표로 구분)
    dss_cn:
      java: dssCn
      description: 질환(말한 것만, 쉼표로 구분)

set_representative_pet:
  label: 대표 반려동물 지정
  target: 반려동물
  hooks: [pet]
  description: |
    반려동물 하나를 대표 반려동물(메인 화면에 먼저 보이는 아이)로 정하는 확인 카드를 대화창에 띄운다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 바꾸지 않는다.

    쓸 때: 대표 반려동물을 바꿔 달라는 말.
      예) "탄이를 대표 반려동물로 해 줘", "메인에 초코가 먼저 나오게 대표로 바꿔 줘"
    쓰지 않을 때: 반려동물 정보(이름·몸무게 등)를 바꾸는 말은 draft_pet_update.
    인자: 반려동물은 고르지 않는다(서버가 문장 속 이름으로 정한다).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.

draft_caregiver_invitation:
  label: 공동양육 초대 보내기
  description: |
    다른 회원을 이메일로 공동양육에 초대하는 확인 카드를 대화창에 띄운다. 초대 메일이 그 사람에게 간다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 보내지 않는다.

    쓸 때: 가족·친구를 이메일로 공동양육에 초대해 달라는 말.
      예) "동생 abc@example.com 으로 초코 공동양육 초대 보내 줘", "엄마도 같이 돌보게 초대해 줘"
    쓰지 않을 때: 보낸 초대를 묻는 말은 list_sent_caregiver_invitations. 보낸 초대를 거두는 말은
      cancel_caregiver_invitation. 초대하는 방법만 묻는 말은 search_guide.
    인자: invtn_trgt_eml은 회원이 말한 이메일 그대로, 말하지 않았으면 비운다(지어내지 않는다).
      pet_sns는 이 턴 list_pets 결과의 petSn 중 말한 아이들만, 결과가 없으면 list_pets를 먼저 부른다.
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    invtn_trgt_eml:
      java: invtnTrgtEml
      description: 초대할 사람 이메일(말한 그대로)
    pet_sns:
      java: petSns
      description: 함께 돌볼 반려동물 번호 목록. 이 턴 list_pets 결과의 petSn만

cancel_caregiver_invitation:
  label: 공동양육 초대 취소
  target: 보낸 초대장
  target_fields: [invtnTrgtEmlMask]
  description: |
    내가 보낸 공동양육 초대 하나를 거두는 확인 카드를 대화창에 띄운다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 바꾸지 않는다.

    쓸 때: 보낸 초대를 취소해 달라는 말.
      예) "동생한테 보낸 초대 취소해 줘", "보낸 공동양육 초대 거둬 줘"
    쓰지 않을 때: 받은 초대를 거절하는 말은 reject_caregiver_invitation. 보낸 초대를 묻기만 하는 말은
      list_sent_caregiver_invitations.
    인자: jnt_brup_invtn_sn은 이 턴 list_sent_caregiver_invitations 결과의 jntBrupInvtnSn만 쓴다. 결과가 없으면
      list_sent_caregiver_invitations를 먼저 부른다. 어느 것인지 하나로 정할 수 없으면 비운다.
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    jnt_brup_invtn_sn:
      java: jntBrupInvtnSn
      description: 취소할 초대 번호. 이 턴 list_sent_caregiver_invitations 결과의 jntBrupInvtnSn만, 모르면 비운다

accept_caregiver_invitation:
  label: 공동양육 초대 수락
  target: 받은 초대장
  description: |
    받은 공동양육 초대를 수락하는 확인 카드를 대화창에 띄운다. 고른 반려동물만 함께 돌보고 나머지는 거절된다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 바꾸지 않는다.

    쓸 때: 받은 초대를 수락해 달라는 말.
      예) "받은 공동양육 초대 수락해 줘", "그 초대 초코만 받을게"
    쓰지 않을 때: 받은 초대를 거절하는 말은 reject_caregiver_invitation. 초대 내용을 묻는 말은
      get_caregiver_invitation.
    인자: jnt_brup_invtn_sn은 이 턴 get_caregiver_invitation 결과의 jntBrupInvtnSn만, 모르면 비운다.
      pet_sns는 이 턴 get_caregiver_invitation 결과 pets의 petSn 중 말한 아이들(말하지 않았으면 모두).
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    jnt_brup_invtn_sn:
      java: jntBrupInvtnSn
      description: 수락할 초대 번호. 이 턴 get_caregiver_invitation 결과의 jntBrupInvtnSn만, 모르면 비운다
    pet_sns:
      java: petSns
      description: 함께 돌볼 반려동물 번호 목록. 이 턴 get_caregiver_invitation 결과 pets의 petSn만

reject_caregiver_invitation:
  label: 공동양육 초대 거절
  target: 받은 초대장
  description: |
    받은 공동양육 초대를 거절하는 확인 카드를 대화창에 띄운다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 바꾸지 않는다.

    쓸 때: 받은 초대를 거절해 달라는 말.
      예) "받은 공동양육 초대 거절해 줘", "그 초대 안 받을래"
    쓰지 않을 때: 내가 보낸 초대를 거두는 말은 cancel_caregiver_invitation. 수락하는 말은
      accept_caregiver_invitation.
    인자: jnt_brup_invtn_sn은 이 턴 get_caregiver_invitation 결과의 jntBrupInvtnSn만, 모르면 비운다.
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    jnt_brup_invtn_sn:
      java: jntBrupInvtnSn
      description: 거절할 초대 번호. 이 턴 get_caregiver_invitation 결과의 jntBrupInvtnSn만, 모르면 비운다

draft_item_purchase:
  label: 아이템 구매
  description: |
    픽셀 캐릭터 상점 아이템을 포인트로 사는 확인 카드를 대화창에 띄운다. 포인트가 빠진다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 사지 않는다.

    쓸 때: 상점 아이템을 사 달라는 말.
      예) "초코 캐릭터에 밀짚모자 사 줘", "빨간 리본 구매해 줘"
    쓰지 않을 때: 살 수 있는 아이템을 묻는 말은 list_shop_items. 이미 가진 아이템을 입히는 말은
      draft_equipped_items. 포인트 잔액은 get_points.
    인자: pixel_char_sn은 이 턴 list_pixel_characters 결과의 pixelCharSn만, item_sns는 이 턴 list_shop_items
      결과의 itemSn 중 말한 것만 쓴다. 결과가 없으면 그 도구를 먼저 부른다.
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    pixel_char_sn:
      java: pixelCharSn
      description: 캐릭터 번호. 이 턴 list_pixel_characters 결과의 pixelCharSn만, 모르면 비운다
    item_sns:
      java: itemSns
      description: 살 아이템 번호 목록. 이 턴 list_shop_items 결과의 itemSn만

draft_equipped_items:
  label: 아이템 장착
  description: |
    픽셀 캐릭터가 입을 아이템(가진 아이템 중)을 정하는 확인 카드를 대화창에 띄운다. 목록에 없는 아이템은 벗는다.
    회원이 대화로 확인 말을 하기 전에는 아무것도 바꾸지 않는다.

    쓸 때: 가진 아이템을 캐릭터에 입히거나 벗겨 달라는 말.
      예) "초코 캐릭터에 밀짚모자 씌워 줘", "캐릭터 아이템 다 벗겨 줘"
    쓰지 않을 때: 새 아이템을 사는 말은 draft_item_purchase. 지금 입은 아이템을 묻는 말은 get_pixel_character.
    인자: pixel_char_sn은 이 턴 list_pixel_characters 결과의 pixelCharSn만 쓴다. hld_item_sns는 이 턴
      get_pixel_character 결과 heldItems의 hldItemSn으로, 입고 있던 것 중 그대로 둘 것과 새로 입힐 것을 모두 넣는다
      (다 벗기면 빈 목록). 결과가 없으면 그 도구를 먼저 부른다.
    말하는 법: 글을 쓰지 않는다. 카드는 서버가 만든다.
  params:
    pixel_char_sn:
      java: pixelCharSn
      description: 캐릭터 번호. 이 턴 list_pixel_characters 결과의 pixelCharSn만, 모르면 비운다
    hld_item_sns:
      java: hldItemSns
      description: 입을 아이템 번호 목록(가진 아이템). 이 턴 get_pixel_character 결과의 hldItemSn만
