    쓸 때: 건강 대시보드에 어떤 위젯이 켜져 있는지 묻는 말.
      예) "건강 대시보드에 뭐 켜 놨지?", "건강 화면 위젯 뭐 보이게 돼 있어?"
    쓰지 않을 때: 체중 등 건강 수치 자체는 get_health_indicators. 위젯을 바꾸는 방법은 search_guide.
    말하는 법: 받은 위젯 이름만 쓴다.

