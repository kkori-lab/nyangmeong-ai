    쓸 때: 처음 안내를 다 봤는지, 튜토리얼 진행 상태를 묻는 말.
      예) "나 튜토리얼 다 봤어?", "처음 안내 끝냈나?"
    쓰지 않을 때: 기능을 쓰는 방법은 search_guide.
    말하는 법: 받은 상태만 쓴다.

