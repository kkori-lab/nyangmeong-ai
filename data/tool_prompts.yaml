    쓸 때: 오늘 케어를 얼마나 했는지, 남은 케어가 몇 개인지 묻는 말.
      예) "오늘 케어 몇 개 했어?", "초코 오늘 케어 다 했나?"
    쓰지 않을 때: 케어 항목 목록은 list_care_items, 어떤 케어를 언제 했는지는 list_care_completions.
      포인트를 주는 케어미션(하루 미션)은 list_daily_missions.
    인자: 반려동물은 고르지 않는다(서버가 정한다).
    말하는 법: 받은 수만 쓴다. 남은 것이 있으면 짧게 알려 준다.

