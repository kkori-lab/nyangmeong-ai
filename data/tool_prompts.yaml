    쓸 때: 특정 약관의 내용을 묻는 말.
      예) "이용약관에 탈퇴하면 어떻게 된다고 돼 있어?", "개인정보 몇 년 보관한다고 돼 있어?"
    쓰지 않을 때: 약관 목록은 list_terms.
    인자: trms_sn은 이 턴 list_terms 결과의 trmsSn만 쓴다. 결과가 없으면 list_terms를 먼저 부른다.
    말하는 법: 받은 본문에 있는 내용만 짧게 옮긴다. 법률 해석을 덧붙이지 않는다.
