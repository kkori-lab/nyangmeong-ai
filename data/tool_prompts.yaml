      예) "접종 증명서 올려 둔 거 있어?", "지난 검진 결과지 첨부했었나?"
    쓰지 않을 때: 검진 날짜·병원은 list_checkups, 혈액 수치는 list_inspection_values.
    인자: 한 검진만 물으면 ckup_rcd_sn은 이 턴 list_checkups 결과의 ckupRcdSn만, 모르면 비운다.
      말하지 않은 칸은 비운다. 반려동물은 고르지 않는다(서버가 정한다).
    말하는 법: 받은 파일 이름·종류·날짜만 쓴다. 파일 내용은 대화창에서 볼 수 없다고 말한다.
